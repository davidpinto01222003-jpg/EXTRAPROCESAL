<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor de Pedidos</title>
<meta name="description" content="Toma de pedidos, cargue del camion, facturas y proyecciones para distribuidores.">
<meta name="theme-color" content="#184f95">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar" id="appbar">
  <div class="appbar-main">
    <h1 id="appbar-title">Pedidos</h1>
    <p class="appbar-sub" id="appbar-sub"></p>
  </div>
  <div class="appbar-actions" id="appbar-actions"></div>
</header>

<main id="main">
  <section class="view" id="view-pedidos" hidden></section>
  <section class="view" id="view-cargue" hidden></section>
  <section class="view" id="view-reportes" hidden></section>
  <section class="view" id="view-catalogo" hidden></section>
  <section class="view" id="view-ajustes" hidden></section>
</main>

<button class="fab" id="fab" type="button" hidden>
  <span aria-hidden="true">+</span><span class="fab-label">Nuevo pedido</span>
</button>

<nav class="tabbar" id="tabbar" aria-label="Secciones">
  <button type="button" data-tab="pedidos" class="tab is-active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v16.2a.8.8 0 0 1-1.2.7L15 19.4l-2.4 1.5a1 1 0 0 1-1.1 0L9 19.4l-2.8 1.5A.8.8 0 0 1 5 20.2V4a1 1 0 0 1 1-1Z"/><path class="ko" d="M8.5 8h7M8.5 12h7"/></svg>
    <span>Pedidos</span>
  </button>
  <button type="button" data-tab="cargue" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6.5A1.5 1.5 0 0 1 3.5 5H13a1 1 0 0 1 1 1v9H2V6.5Z"/><path d="M14 9h3.6a1 1 0 0 1 .84.46l2.4 3.7a1 1 0 0 1 .16.54V15h-7V9Z"/><circle cx="7" cy="17.5" r="2.4"/><circle cx="17" cy="17.5" r="2.4"/></svg>
    <span>Cargue</span>
  </button>
  <button type="button" data-tab="reportes" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4.4" height="8" rx="1"/><rect x="9.8" y="7" width="4.4" height="13" rx="1"/><rect x="16.6" y="3.5" width="4.4" height="16.5" rx="1"/></svg>
    <span>Reportes</span>
  </button>
  <button type="button" data-tab="catalogo" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.2 12 3l8 4.2v9.6L12 21l-8-4.2V7.2Z"/><path class="ko" d="m4 7.2 8 4.3 8-4.3M12 11.5V21"/></svg>
    <span>Catálogo</span>
  </button>
  <button type="button" data-tab="ajustes" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6A3.4 3.4 0 1 0 12 15.4 3.4 3.4 0 0 0 12 8.6Zm8.5 3.4c0 .5 0 1-.1 1.4l2 1.5-1.9 3.3-2.4-.9c-.7.6-1.5 1-2.3 1.4L15.4 22h-3.8l-.4-2.5c-.9-.3-1.7-.8-2.4-1.4l-2.3 1-2-3.4 2-1.5a8.6 8.6 0 0 1 0-2.8l-2-1.5 2-3.3 2.3.9c.7-.6 1.5-1 2.4-1.4L11.6 2h3.8l.4 2.6c.9.3 1.7.8 2.3 1.4l2.4-1 1.9 3.4-2 1.5c.1.4.1.9.1 1.4Z"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="modal-root"></div>
<div id="print-root" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
