<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa8ff"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#172f7a"/></linearGradient>
  <radialGradient id="glow" cx=".28" cy=".18" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="ground" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0b1b4d" stop-opacity=".55"/><stop offset="1" stop-color="#0b1b4d" stop-opacity="0"/></radialGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9fb"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8cbef"/><stop offset="1" stop-color="#8ea8dc"/></linearGradient>
  <linearGradient id="roofF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#f26b1d"/></linearGradient>
  <linearGradient id="roofS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2600f"/><stop offset="1" stop-color="#b8440a"/></linearGradient>
  <linearGradient id="roofEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#9a330a"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#4f9cf5"/></linearGradient>
  <linearGradient id="coinTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#e08a00"/></linearGradient>
  <linearGradient id="coinRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c77700"/><stop offset="1" stop-color="#8a4b00"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="6" dy="14" stdDeviation="10" flood-color="#0b1b4d" flood-opacity=".45"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="512" height="512" rx="0" fill="url(#bg)"/>
<rect width="512" height="512" rx="0" fill="url(#glow)"/>
<g transform="translate(256 270) scale(1) translate(-256 -270)">
  <ellipse cx="272" cy="414" rx="170" ry="28" fill="url(#ground)"/>
  <g filter="url(#sh)">
    <!-- cuerpo: pared lateral, fachada y gablete -->
    <path d="M346 250 L406 216 L406 366 L346 400 Z" fill="url(#side)"/>
    <path d="M140 250 L243 149 L346 250 L346 392 Q346 400 338 400 L148 400 Q140 400 140 392 Z" fill="url(#front)"/>
    <!-- techo: faldón derecho (une con la cumbrera) -->
    <path d="M243 138 L303 104 L434 232 L374 266 Z" fill="url(#roofS)"/>
    <path d="M374 266 L434 232 L434 254 L374 288 Z" fill="#8f2f08"/>
    <!-- borde frontal del techo -->
    <path d="M112 266 L243 138 L374 266 L374 288 L243 160 L112 288 Z" fill="url(#roofF)"/>
    <path d="M134 298 L243 190 L352 298" fill="none" stroke="#0b1b4d" stroke-opacity=".12" stroke-width="10" stroke-linejoin="round"/>
    <path d="M124 262 L243 146" stroke="#ffd59a" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <circle cx="243" cy="232" r="17" fill="#1e3a8a"/><circle cx="243" cy="232" r="13" fill="url(#glass)"/><path d="M236 240 L250 225" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <!-- puerta -->
    <rect x="217" y="318" width="52" height="82" rx="8" fill="url(#door)"/>
    <rect x="221" y="322" width="16" height="74" rx="6" fill="#ffffff" opacity=".18"/>
    <circle cx="258" cy="362" r="5" fill="#fbbf24"/>
    <!-- ventanas -->
    <g><rect x="158" y="300" width="40" height="40" rx="7" fill="#1e3a8a"/><rect x="161" y="303" width="34" height="34" rx="5" fill="url(#glass)"/>
      <path d="M178 303 V337 M161 320 H195" stroke="#ffffff" stroke-width="4"/><path d="M165 330 L185 307" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/></g>
    <g><rect x="286" y="300" width="40" height="40" rx="7" fill="#1e3a8a"/><rect x="289" y="303" width="34" height="34" rx="5" fill="url(#glass)"/>
      <path d="M306 303 V337 M289 320 H323" stroke="#ffffff" stroke-width="4"/><path d="M293 330 L313 307" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/></g>
  </g>
  <!-- moneda 3D -->
  <g filter="url(#sh)">
    <ellipse cx="372" cy="398" rx="66" ry="66" fill="url(#coinRim)"/>
    <rect x="306" y="380" width="132" height="18" fill="url(#coinRim)"/>
    <circle cx="372" cy="380" r="66" fill="url(#coinTop)"/>
    <circle cx="372" cy="380" r="50" fill="none" stroke="#c77700" stroke-width="6" opacity=".55"/>
    <circle cx="372" cy="380" r="50" fill="none" stroke="#fff6c8" stroke-width="2" opacity=".8" transform="translate(-2 -2)"/>
    <text x="374" y="406" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#b45f00">$</text>
    <text x="371" y="403" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#fffbe8">$</text>
    <path d="M326 352 A54 54 0 0 1 380 326" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- destellos -->
  <path d="M104 118 l9 24 l24 9 l-24 9 l-9 24 l-9 -24 l-24 -9 l24 -9 z" fill="#ffe680"/>
  <path d="M420 96 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z" fill="#ffffff" opacity=".95"/>
  <path d="M86 352 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#ffffff" opacity=".7"/>
</g>
</svg>