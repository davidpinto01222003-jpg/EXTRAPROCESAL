<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de la Casa</title>
<meta name="description" content="Gastos, ingresos, aportes e informes del hogar, compartidos con toda la familia.">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas Casa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fija con la navegación + área de trabajo en tarjetas; en móvil la barra pasa arriba y aparece un botón flotante para registrar. */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f5f8f6; --line:#d9e2dc;
  --fg:#142019; --muted:#5b6b62; --accent:#0f6b4f; --accent-fg:#ffffff; --accent-soft:#d6ebe1;
  --in:#1b8657; --in-soft:#dcf1e6; --out:#bf4338; --out-soft:#f8e1de; --warn:#a86b12; --warn-soft:#f8ecd4;
  --gold:#d6992a; --save:#a26a00; --save-soft:#fbefd6; --shadow:0 1px 2px rgba(20,32,25,.06),0 6px 20px rgba(20,32,25,.06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --line:#29352f;
    --fg:#e5eee8; --muted:#93a39a; --accent:#4cc495; --accent-fg:#06281b; --accent-soft:#1c3a2d;
    --in:#4cc495; --in-soft:#173527; --out:#f07a6e; --out-soft:#3d1f1c; --warn:#e7b45c; --warn-soft:#3a2d14;
    --gold:#e7b45c; --save:#f0c06a; --save-soft:#3a2e15; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --line:#29352f;
  --fg:#e5eee8; --muted:#93a39a; --accent:#4cc495; --accent-fg:#06281b; --accent-soft:#1c3a2d;
  --in:#4cc495; --in-soft:#173527; --out:#f07a6e; --out-soft:#3d1f1c; --warn:#e7b45c; --warn-soft:#3a2d14;
  --gold:#e7b45c; --save:#f0c06a; --save-soft:#3a2e15; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.in{color:var(--in)} .out{color:var(--out)} .save{color:var(--save)}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px}
.brand-mark{width:42px;height:42px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 4px 12px rgba(23,47,122,.35)}
.brand-mark img{display:block;width:100%;height:100%}
.brand-mark svg.lucide{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.1rem;display:block;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.side-foot .pill{white-space:normal}
.install-btn{margin-top:auto}
.topbar,.scrim{display:none}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,20,15,.45)}
.topbar-logo{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:0 3px 10px rgba(23,47,122,.3)}
.topbar-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.topbar-t b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-t span{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.topbar .icon-btn{width:42px;height:42px}
.topbar .icon-btn svg.lucide{width:22px;height:22px}
.env-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 10px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--fg)}
.env-chip svg.lucide{width:15px;height:15px;color:var(--accent)}
.icon-btn.drawer-close{display:none}
@media (max-width:860px){.icon-btn.drawer-close{display:inline-grid;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:10px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.env-switch{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.env-switch button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.env-switch button.on{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow)}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);cursor:pointer;font-weight:500;color:var(--fg);font-size:.9rem}
.check-row input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--accent)}
.check-row > span{display:flex;gap:8px;align-items:center}
.pill svg.lucide{width:13px;height:13px}
.install-btn + .side-foot{margin-top:0}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:1.05rem;letter-spacing:.06em;background:var(--surface-2);border:1px dashed var(--line);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.pill svg.lucide{width:13px;height:13px}
.main{padding-block:28px 96px;padding-inline:clamp(16px,3vw,40px);min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:8px}
.card-h h2 svg.lucide{color:var(--accent)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600;font-size:.88rem}
.kpi-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.kpi-v{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.hero .kpi-top{color:inherit;opacity:.85}
.kpi.hero .kpi-ic{background:rgba(255,255,255,.18)}
.kpi.hero .muted{color:inherit;opacity:.85}
.delta{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta svg.lucide{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)}
.pill.bad{background:var(--out-soft);color:var(--out)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.save{background:var(--save-soft);color:var(--save)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar.lg{height:12px}
.cat-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:.95rem}
.avatar.sm{width:26px;height:26px;font-size:.72rem}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1;min-width:200px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg.lucide{width:30px;height:30px}

/* listas de movimientos */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:2px}
.day-h{display:flex;justify-content:space-between;gap:10px;padding:14px 4px 6px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}

/* tablas */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
tr.sel td{background:var(--accent-soft)}
tbody tr:hover td{background:var(--surface-2)}

/* formularios */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{flex:1 1 150px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.type button.on[data-v="gasto"]{color:var(--out)}
.seg.type button.on[data-v="ingreso"]{color:var(--in)}
.seg.type button.on[data-v="ahorro"]{color:var(--save)}
.seg.type button.on[data-v="transferencia"]{color:var(--accent)}
.seg.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.four button{justify-content:center;padding-inline:6px}
.month-nav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.month-nav b{min-width:130px;text-align:center;font-family:var(--f-display)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.amount-input{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icon-grid button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;display:grid;place-items:center}
.icon-grid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--fg)}

/* modal */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.modal{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.modal-b{padding:12px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}

.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 28px rgba(0,0,0,.22);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer;display:grid;place-items:center;z-index:20}
.fab svg.lucide{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.chart-box{position:relative;height:260px;min-width:0}
.chart-box.sm{height:210px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:.9rem;min-width:0}
.legend-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person-card{display:flex;flex-direction:column;gap:12px}
.stat-line{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.stat-line b{font-variant-numeric:tabular-nums}
.goal-ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.goal-ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.print-only{display:none}


/* ---------- iconos a color ---------- */
svg.fe{display:block;flex:none}
.tile{border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.avatar.emo{background:var(--surface-2);background:color-mix(in srgb,var(--c) 20%,var(--surface));box-shadow:inset 0 0 0 2px var(--c)}
.empty svg.fe{opacity:.9}
.mini-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.icon-picker{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.icon-grid button{min-height:44px}
.accents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.accent-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-weight:600;font-size:.82rem}
.accent-opt span{width:30px;height:30px;border-radius:50%}
.accent-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.goal .ring{background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}

/* ---------- ranking ---------- */
.rank{display:flex;flex-direction:column;gap:12px;min-width:0}
.rank-row{display:flex;gap:12px;align-items:center;min-width:0}
.rank-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rank-top{display:flex;justify-content:space-between;gap:10px}
.rank-top .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.spark{display:block}
.split.wide{grid-template-columns:minmax(0,300px) minmax(0,1fr)}

/* ---------- encabezado de informes ---------- */
.rep-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:24px;border-radius:20px;color:var(--accent-fg);
  background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.16),transparent 55%),var(--accent)}
.rep-hero h2{font-size:1.6rem;font-weight:800;color:inherit}
.hero-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.rep-big{font-family:var(--f-display);font-size:clamp(2rem,5vw,2.8rem);font-weight:800;line-height:1.1;margin-top:14px;overflow-wrap:anywhere}
.hero-note{opacity:.85;font-size:.9rem}
.rep-hero-side{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.hero-stats{display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:0}
.hero-stat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12)}
.hero-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.hero-l{font-size:.78rem;opacity:.85}
.hero-v{font-weight:800;font-size:1.05rem}
.hero-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.8rem;padding:12px;border-radius:12px;background:rgba(255,255,255,.12);flex:0 1 130px}
.hero-ring .ring{width:84px;height:84px;background:conic-gradient(var(--accent-fg) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
.hero-ring .ring span{width:64px;height:64px;background:var(--accent);color:var(--accent-fg);font-size:1rem}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.insight{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);border-left:4px solid var(--t)}
.insight p{font-size:.9rem;min-width:0}
.day-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.day-hero h2{font-size:1.35rem}
.day-hero .hero-eyebrow{color:var(--muted)}
.day-title{flex:1 1 240px;min-width:0}
.day-stats{flex:1 1 260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.day-stats div{display:flex;flex-direction:column}
.day-stats span{font-size:.75rem;color:var(--muted)}
.day-stats b{font-size:1.05rem}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.cal-day{position:relative;aspect-ratio:1/1;min-height:40px;border:1px solid transparent;border-radius:10px;cursor:pointer;padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;overflow:hidden;
  background:var(--surface-2);background:color-mix(in srgb,var(--out) var(--k),var(--surface-2))}
.cal-day.hot{color:#fff}
.cal-day.sel{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.cal-day.today .cal-n{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 4px}
.cal-n{font-weight:700;font-size:.8rem}
.cal-v{font-size:.64rem;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--in);box-shadow:0 0 0 2px var(--surface)}
.cal-dot.static{position:static;display:inline-block}
.cal-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-scale{width:80px;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--surface-2),var(--out))}
.lg-sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- mes a mes ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;min-width:0}
.mcard:hover{border-color:var(--accent)}
.mcard.off{opacity:.55}
.mcard-h{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:.9rem}
.mcard-h span{font-weight:700;font-size:.82rem}
.mbar{height:7px;border-radius:99px;background:var(--surface);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:inherit}
.mcard-f{display:flex;justify-content:space-between}

/* ---------- personas en informes ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.person-rep{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);min-width:0}
.person-rep .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.person-nums{display:flex;gap:4px 14px;flex-wrap:wrap;color:var(--muted)}
.person-nums b{color:var(--fg);font-variant-numeric:tabular-nums}
.person-nums b.in{color:var(--in)} .person-nums b.save{color:var(--save)}

/* ---------- tarjetas de cuentas ---------- */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.acct-card{--c:#334155;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;color:#fff;min-width:0;
  background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.22),transparent 50%),linear-gradient(135deg,var(--c),#1b1f24);
  background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.22),transparent 50%),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:var(--shadow)}
.acct-top{display:flex;align-items:center;gap:10px}
.acct-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.92);display:grid;place-items:center;flex:none}
.acct-type{font-size:.78rem;opacity:.8}
.acct-card .icon-btn{color:rgba(255,255,255,.8)}
.acct-card .icon-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.acct-l{font-size:.75rem;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.acct-v{font-family:var(--f-display);font-size:1.7rem;font-weight:800;overflow-wrap:anywhere}
.acct-flow{display:flex;gap:12px;font-size:.8rem;opacity:.9;flex-wrap:wrap;align-items:center}
.acct-flow span{display:inline-flex;align-items:center;gap:4px}
.acct-flow svg.lucide{width:14px;height:14px}
.acct-m{margin-left:auto;text-transform:uppercase;font-weight:700;opacity:.8}
.acct-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:8px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;cursor:pointer}
.acct-btn:hover{background:rgba(255,255,255,.26)}

details.card summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.card[open] summary::after{content:"－"}
details.card summary svg.lucide{color:var(--accent)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:0;z-index:25;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);height:100%;z-index:40;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .25s ease;border-right:1px solid var(--line)}
  .app.menu-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .app.menu-open .scrim{display:block}
  .nav a{padding:11px 12px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .split,.split.wide{grid-template-columns:minmax(0,1fr)}
  .rep-hero{grid-template-columns:minmax(0,1fr);padding:20px}
}
@media (max-width:520px){
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi-v{font-size:1.25rem}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.45rem}
  .btn{white-space:normal;text-align:left}
  .row .avatar.sm{display:none}
  .seg.four button{flex-direction:column;gap:2px;font-size:.78rem}
  .accents{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cal{gap:3px}
  .cal-day{border-radius:8px;padding:3px}
  .cal-v{font-size:.56rem}
  .hero-ring{flex-basis:100%;flex-direction:row}
  .row.wrap{flex-wrap:wrap}
  .row.wrap .grow{flex-basis:calc(100% - 48px)}
  .row .acts .icon-btn{padding:4px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
@media print{
  .side,.fab,.head-actions,.no-print{display:none!important}
  .app{display:block}
  .main{padding:0}
  .card,.kpi{break-inside:avoid;box-shadow:none}
  .print-only{display:block}
  body{background:#fff}
}
</style>

<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" data-act="menu" id="menu-btn" aria-label="Abrir menú" aria-controls="side" aria-expanded="false"><i data-lucide="menu"></i></button>

  <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const COLORS = ['#0f6b4f','#3b6fd8','#c2453a','#d6992a','#8b5cf6','#0e9aa7','#e0607e','#6b8e23','#b5651d','#5a6b7b','#2f9e44','#cc5de8'];
const TIPOS_CUENTA = { efectivo: ['Efectivo', 'dollar-banknote'], banco: ['Cuenta bancaria', 'bank'], ahorros: ['Cuenta de ahorros o bolsillo', 'money-bag'], tarjeta: ['Tarjeta de crédito', 'credit-card'], billetera: ['Billetera digital (Nequi, Daviplata…)', 'mobile-phone'], inversion: ['Inversión o CDT', 'chart-increasing'], otra: ['Otra', 'coin'] };
const TIPOS_MOV = { gasto: ['Gasto', 'arrow-up-right'], ingreso: ['Ingreso', 'arrow-down-left'], ahorro: ['Ahorro', 'piggy-bank'], transferencia: ['Entre cuentas', 'arrow-left-right'] };
const ICON_GROUPS = [
  ['Casa', ['house', 'house-with-garden', 'key', 'couch-and-lamp', 'bed', 'bathtub', 'toilet', 'broom', 'basket', 'sponge', 'soap', 'light-bulb', 'potted-plant', 'hammer-and-wrench', 'wrench', 'toolbox', 'locked']],
  ['Servicios', ['high-voltage', 'droplet', 'fire', 'globe-with-meridians', 'mobile-phone', 'laptop', 'television', 'satellite-antenna']],
  ['Comida', ['shopping-cart', 'shopping-bags', 'green-apple', 'bread', 'cheese-wedge', 'meat-on-bone', 'carrot', 'glass-of-milk', 'herb', 'pizza', 'hamburger', 'fork-and-knife-with-plate', 'hot-beverage', 'beer-mug', 'birthday-cake', 'popcorn']],
  ['Transporte', ['automobile', 'bus', 'motor-scooter', 'taxi', 'fuel-pump', 'bicycle', 'airplane']],
  ['Salud y cuidado', ['stethoscope', 'pill', 'hospital', 'tooth', 'syringe', 'test-tube', 'red-heart', 'lipstick', 'person-getting-haircut', 'person-lifting-weights']],
  ['Familia y estudio', ['graduation-cap', 'books', 'backpack', 'pencil', 'baby-bottle', 'baby', 'teddy-bear', 't-shirt', 'dress', 'running-shoe']],
  ['Ocio', ['clapper-board', 'video-game', 'musical-note', 'ticket', 'soccer-ball', 'beach-with-umbrella', 'camera', 'party-popper', 'christmas-tree', 'wrapped-gift']],
  ['Mascotas', ['dog-face', 'cat-face', 'dog', 'cat', 'paw-prints', 'bone']],
  ['Dinero', ['dollar-banknote', 'coin', 'money-bag', 'money-with-wings', 'credit-card', 'bank', 'chart-increasing', 'briefcase', 'gem-stone', 'receipt', 'classical-building', 'place-of-worship', 'shield', 'umbrella', 'handshake', 'trophy', 'rocket', 'hourglass-done', 'calendar', 'label', 'package', 'sparkles']],
];
const PEOPLE_ICONS = ['woman', 'man', 'old-woman', 'girl', 'boy', 'baby', 'person', 'woman-technologist', 'man-construction-worker', 'dog-face', 'cat-face'];
// iconos de versiones anteriores (Lucide) → iconos a color
const LUC2FE = { house: 'house', zap: 'high-voltage', droplets: 'droplet', flame: 'fire', wifi: 'globe-with-meridians', smartphone: 'mobile-phone', tv: 'television', 'shopping-cart': 'shopping-cart', utensils: 'fork-and-knife-with-plate', coffee: 'hot-beverage', car: 'automobile', bus: 'bus', fuel: 'fuel-pump', 'heart-pulse': 'stethoscope', pill: 'pill', 'graduation-cap': 'graduation-cap', 'book-open': 'books', baby: 'baby-bottle', shirt: 't-shirt', film: 'clapper-board', music: 'musical-note', plane: 'airplane', dumbbell: 'person-lifting-weights', dog: 'dog-face', wrench: 'hammer-and-wrench', sofa: 'couch-and-lamp', shield: 'shield', 'credit-card': 'credit-card', landmark: 'bank', receipt: 'receipt', gift: 'wrapped-gift', package: 'package', leaf: 'herb', briefcase: 'briefcase', sparkles: 'sparkles', 'trending-up': 'chart-increasing', 'hand-coins': 'handshake', coins: 'coin', wallet: 'dollar-banknote', 'piggy-bank': 'money-bag', 'building-2': 'classical-building', laptop: 'laptop' };
const ACCENTS = {
  verde:    { n: 'Verde',    l: ['#0f6b4f', '#d6ebe1', '#ffffff'], d: ['#4cc495', '#1c3a2d', '#06281b'] },
  azul:     { n: 'Azul',     l: ['#2457c5', '#dde7fb', '#ffffff'], d: ['#7aa5ff', '#1b2a4a', '#0a1530'] },
  morado:   { n: 'Morado',   l: ['#6d3fc4', '#ebe2fa', '#ffffff'], d: ['#b394ff', '#2c2147', '#1a0f33'] },
  rosa:     { n: 'Rosa',     l: ['#c2357a', '#fbe1ee', '#ffffff'], d: ['#ff8cc0', '#45203a', '#2d0a1d'] },
  naranja:  { n: 'Naranja',  l: ['#c65a12', '#fde6d4', '#ffffff'], d: ['#ffa461', '#43291a', '#2b1406'] },
  turquesa: { n: 'Turquesa', l: ['#0b7f8a', '#d5f0f2', '#ffffff'], d: ['#4fd1dc', '#173a3e', '#04282c'] },
  rojo:     { n: 'Rojo',     l: ['#b3261e', '#f9dedc', '#ffffff'], d: ['#ff8a80', '#46201d', '#2d0705'] },
  grafito:  { n: 'Grafito',  l: ['#334155', '#e2e8f0', '#ffffff'], d: ['#cbd5e1', '#273244', '#0f172a'] },
};

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymOf = s => s.slice(0, 7);
const dim = (y, m) => new Date(y, m, 0).getDate();
const parseYM = ym => ym.split('-').map(Number);
const shiftYM = (ym, k) => { const [y, m] = parseYM(ym); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const ymLabel = ym => { const [y, m] = parseYM(ym); return `${MESES[m - 1]} ${y}`; };
const dateLabel = s => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MES_C[m - 1]} ${y}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dateLong = s => { const [y, m, d] = s.split('-').map(Number); const w = new Date(y, m - 1, d).getDay(); return `${DIAS[w]} ${d} de ${MESES[m - 1].toLowerCase()} de ${y}`; };

/* preferencias de este teléfono (no se comparten) */
const LOCAL_KEY = 'cuentas-casa-local';
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } };
const LOCAL = Object.assign({ yo: '', tema: 'sistema', acento: 'verde', acentoP: 'morado', ultCuenta: '', ultCuentaP: '', entorno: 'hogar' }, lsGet(LOCAL_KEY, {}));
const saveLocalPrefs = () => lsSet(LOCAL_KEY, LOCAL);

/* =========================================================
   Estado
   ========================================================= */
const KEY = 'cuentas-casa-v1', KEY_P = 'cuentas-casa-personal-v1';
// Dos entornos: «hogar» (compartido con la familia) y «personal» (solo en este teléfono)
const DATA = { hogar: load(KEY, true), personal: load(KEY_P, false) };
const envName = () => LOCAL.entorno === 'personal' ? 'personal' : 'hogar';
const isPersonal = () => envName() === 'personal';
let S = DATA[envName()];
function setS(o) { DATA[envName()] = o; S = o; }
function setHogar(o) { DATA.hogar = o; if (!isPersonal()) S = o; }
const UI = { mes: ymOf(todayStr()), view: 'inicio', rep: 'mensual', repDia: todayStr(), repMes: ymOf(todayStr()), repAnio: +todayStr().slice(0, 4),
  f: { mes: ymOf(todayStr()), tipo: '', cat: '', per: '', q: '', cta: '' } };

function defaultCategorias() {
  const g = (id, nombre, icono, color, presupuesto = 0) => ({ id, nombre, tipo: 'gasto', icono, color, presupuesto });
  const i = (id, nombre, icono, color) => ({ id, nombre, tipo: 'ingreso', icono, color, presupuesto: 0 });
  return [
    g('c-vivienda', 'Arriendo / hipoteca', 'house', '#0f6b4f'),
    g('c-servicios', 'Servicios públicos', 'high-voltage', '#d6992a'),
    g('c-internet', 'Internet y telefonía', 'globe-with-meridians', '#3b6fd8'),
    g('c-mercado', 'Mercado', 'shopping-cart', '#2f9e44'),
    g('c-aseo', 'Aseo y limpieza', 'broom', '#0e9aa7'),
    g('c-restaurantes', 'Restaurantes y domicilios', 'pizza', '#e0607e'),
    g('c-transporte', 'Transporte', 'automobile', '#0e9aa7'),
    g('c-salud', 'Salud', 'stethoscope', '#c2453a'),
    g('c-educacion', 'Educación', 'graduation-cap', '#8b5cf6'),
    g('c-ropa', 'Ropa y cuidado personal', 't-shirt', '#cc5de8'),
    g('c-ocio', 'Ocio y entretenimiento', 'clapper-board', '#b5651d'),
    g('c-mascotas', 'Mascotas', 'dog-face', '#6b8e23'),
    g('c-hogar', 'Mantenimiento del hogar', 'hammer-and-wrench', '#5a6b7b'),

  try { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: S.moneda, maximumFractionDigits: dec, minimumFractionDigits: dec }).format(n || 0); }
  catch (e) { return (n || 0).toFixed(dec); }
};
const moneyShort = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.', ',') + ' mil M';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' M';

const pct = (a, b) => b ? a / b * 100 : 0;
const fmtPct = n => `${(Math.round(n * 10) / 10).toString().replace('.', ',')} %`;
const movsMes = ym => S.movimientos.filter(m => m.fecha.startsWith(ym));
const movsAnio = y => S.movimientos.filter(m => m.fecha.startsWith(String(y)));

function totals(list) {
  let ing = 0, gas = 0, aho = 0;
  list.forEach(m => { if (m.tipo === 'ingreso') ing += m.monto; else if (m.tipo === 'gasto') gas += m.monto; else if (m.tipo === 'ahorro') aho += ahorroNeto(m); });
  return { ing, gas, aho, bal: ing - gas, disp: ing - gas - aho, tasa: ing ? aho / ing * 100 : 0 };
}
const byKey = (list, keyFn, val = m => m.monto) => { const o = {}; list.forEach(m => { const k = keyFn(m); o[k] = (o[k] || 0) + val(m); }); return o; };
const sortDesc = (a, b) => (b.fecha + b.id).localeCompare(a.fecha + a.id);

// cuánto mueve un movimiento el saldo de una cuenta
function efecto(m, id) {
  if (m.tipo === 'ingreso') return m.cuentaId === id ? m.monto : 0;
  if (m.tipo === 'gasto') return m.cuentaId === id ? -m.monto : 0;
  if (!m.cuentaDestinoId) return 0; // ahorro sin cuenta destino: el dinero se aparta pero no se mueve
  const from = m.retiro ? m.cuentaDestinoId : m.cuentaId, to = m.retiro ? m.cuentaId : m.cuentaDestinoId;
  return (to === id ? m.monto : 0) - (from === id ? m.monto : 0);
}

/* reparto de gastos entre personas según porcentaje acordado */
function reparto(list) {
  const gastos = list.filter(m => m.tipo === 'gasto');
  const total = sum(gastos, m => m.monto);
  const totalPct = sum(S.personas, p => p.porcentaje);
  const rows = S.personas.map(p => {
    const pagado = sum(gastos.filter(m => m.personaId === p.id), m => m.monto);
    const aportado = sum(list.filter(m => m.tipo === 'ingreso' && m.personaId === p.id), m => m.monto);
    const ahorro = sum(list.filter(m => m.tipo === 'ahorro' && m.personaId === p.id), ahorroNeto);
    const cuota = totalPct ? total * p.porcentaje / totalPct : 0;
    return { p, pagado, aportado, ahorro, cuota, dif: pagado - cuota };
  });
  const deud = rows.filter(r => r.dif < -1).map(r => ({ p: r.p, v: -r.dif })).sort((a, b) => b.v - a.v);
  const acre = rows.filter(r => r.dif > 1).map(r => ({ p: r.p, v: r.dif })).sort((a, b) => b.v - a.v);
  const pagos = []; let i = 0, j = 0;
  while (i < deud.length && j < acre.length) {
    const v = Math.min(deud[i].v, acre[j].v);
    if (v > 1) pagos.push({ de: deud[i].p, a: acre[j].p, v });
    deud[i].v -= v; acre[j].v -= v;
    if (deud[i].v <= 1) i++; if (acre[j].v <= 1) j++;
  }
  return { total, totalPct, rows, pagos, comun: sum(gastos.filter(m => !per(m.personaId)), m => m.monto) };
}

const bar = (p, color, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%;background:${color}"></i></div>`;
function spark(vals, color) {

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

/* ranking de categorías con icono, barra y presupuesto */
function catRanking(byCat, total, opts = {}) {
  const rows = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

const charts = {};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hexA = (hex, a) => { const h = hex.replace('#', ''); if (h.length !== 6) return hex; const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function destroyCharts() { Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function chart(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  if (!window.Chart) { el.parentElement.innerHTML = empty('chart-increasing', 'No se pudieron cargar los gráficos.'); return; }
  Chart.defaults.color = cssv('--muted'); Chart.defaults.borderColor = cssv('--line');
  Chart.defaults.font.family = cssv('--f-body') || 'system-ui'; Chart.defaults.font.size = 12;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, plugins: {} }, cfg.options || {});
  cfg.options.plugins.tooltip = Object.assign({ backgroundColor: cssv('--fg'), titleColor: cssv('--bg'), bodyColor: cssv('--bg'), padding: 10, cornerRadius: 10, boxPadding: 4,
    callbacks: { label: c => `${c.dataset.label ? c.dataset.label + ': ' : (c.label ? c.label + ': ' : '')}${money(c.parsed.y ?? c.parsed)}` } }, cfg.options.plugins.tooltip || {});
  charts[id] = new Chart(el, cfg);
}
const moneyAxis = () => ({ ticks: { callback: v => moneyShort(v) }, grid: { color: cssv('--line') }, border: { display: false } });
const xAxis = () => ({ grid: { display: false }, border: { display: false } });
const legendBottom = () => ({ position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', padding: 14 } });
const centerText = (top, bottom) => ({ id: 'center', afterDraw(ch) {
  const { ctx, chartArea: a } = ch; if (!a) return; const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = cssv('--fg'); ctx.font = `800 17px ${cssv('--f-display') || 'sans-serif'}`; ctx.fillText(top, x, y - 8);
  ctx.fillStyle = cssv('--muted'); ctx.font = `600 12px ${cssv('--f-body') || 'sans-serif'}`; ctx.fillText(bottom, x, y + 12); ctx.restore(); } });
const areaFill = color => c => { const { chart: ch } = c; const a = ch.chartArea; if (!a) return hexA(color, .15);
  const g = ch.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, hexA(color, .35)); g.addColorStop(1, hexA(color, 0)); return g; };
function donut(id, byCat, total) {
  const rows = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  chart(id, { type: 'doughnut', data: { labels: rows.map(([k]) => cat(k).nombre), datasets: [{ data: rows.map(x => x[1]), backgroundColor: rows.map(([k]) => cat(k).color), borderColor: cssv('--surface'), borderWidth: 3, borderRadius: 6, hoverOffset: 6 }] },
    options: { cutout: '70%', plugins: { legend: { display: false } } }, plugins: [centerText(moneyShort(total), 'gastado')] });
}

function calendario(ym, sel) {
  const [y, m] = parseYM(ym); const n = dim(y, m); const first = (new Date(y, m - 1, 1).getDay() + 6) % 7; const hoy = todayStr();
  const list = movsMes(ym); const g = Array(n + 1).fill(0), ing = Array(n + 1).fill(0);
  list.forEach(x => { const d = +x.fecha.slice(8); if (x.tipo === 'gasto') g[d] += x.monto; if (x.tipo === 'ingreso') ing[d] += x.monto; });
  const max = Math.max(...g, 1);
  let cells = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="cal-h">${d}</div>`).join('') + '<div class="cal-blank"></div>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const f = `${ym}-${pad(d)}`; const k = g[d] ? 12 + Math.round(g[d] / max * 78) : 0;
    cells += `<button class="cal-day ${f === sel ? 'sel' : ''} ${f === hoy ? 'today' : ''} ${k > 55 ? 'hot' : ''}" data-act="go-dia" data-d="${f}" style="--k:${k}%" aria-label="${dateLong(f)}: ${money(g[d])}">
      <span class="cal-n">${d}</span>${g[d] ? `<span class="cal-v">${moneyShort(g[d])}</span>` : ''}${ing[d] ? '<span class="cal-dot" title="Hubo ingresos"></span>' : ''}</button>`;
  }
  return `<div class="cal">${cells}</div><div class="cal-legend small muted"><span>Menos gasto</span><span class="cal-scale"></span><span>Más gasto</span><span class="cal-dot static"></span><span>Día con ingresos</span></div>`;
}

function repDiario() {

function insightsMes(ym) {
  const list = movsMes(ym); const t = totals(list); const prevYM = shiftYM(ym, -1); const tp = totals(movsMes(prevYM));
  const gastos = list.filter(m => m.tipo === 'gasto'); const out = [];
  const enCurso = ym === ymOf(todayStr()); const hastaDia = +todayStr().slice(8);
  const gPrevComp = enCurso ? sum(movsMes(prevYM).filter(m => m.tipo === 'gasto' && +m.fecha.slice(8) <= hastaDia), m => m.monto) : tp.gas;
  if (gPrevComp && t.gas) { const d = pct(t.gas - gPrevComp, gPrevComp); out.push([d <= 0 ? 'chart-increasing' : 'money-with-wings', `Gastaron <b>${fmtPct(Math.abs(d))} ${d <= 0 ? 'menos' : 'más'}</b> que ${enCurso ? `en los primeros ${hastaDia} días de` : 'en'} ${MESES[parseYM(prevYM)[1] - 1].toLowerCase()} (${money(Math.abs(t.gas - gPrevComp))} de diferencia).`, d <= 0 ? 'ok' : 'bad']); }
  const bc = Object.entries(byKey(gastos, m => m.categoriaId)).sort((a, b) => b[1] - a[1]);
  if (bc.length) { const c = cat(bc[0][0]); out.push([c.icono, `<b>${esc(c.nombre)}</b> fue lo que más pesó: ${money(bc[0][1])}, el ${fmtPct(pct(bc[0][1], t.gas))} de los gastos.`, 'info']); }
  const pc = byKey(movsMes(prevYM).filter(m => m.tipo === 'gasto'), m => m.categoriaId);
  const sube = bc.map(([k, v]) => ({ k, v, p: pc[k] ? pct(v - pc[k], pc[k]) : 0, d: v - (pc[k] || 0) })).filter(x => pc[x.k] && x.p >= 20 && x.d > 20000).sort((a, b) => b.d - a.d)[0];
  if (sube) out.push([cat(sube.k).icono, `<b>${esc(cat(sube.k).nombre)}</b> subió ${fmtPct(sube.p)} frente al mes anterior.`, 'warn']);
  const pd = Object.entries(byKey(gastos, m => m.fecha)).sort((a, b) => b[1] - a[1])[0];
  if (pd) out.push(['calendar', `El día de más gasto fue el <b>${dateLong(pd[0])}</b>: ${money(pd[1])}.`, 'info']);
  const exc = S.categorias.filter(c => c.tipo === 'gasto' && c.presupuesto && (bc.find(x => x[0] === c.id)?.[1] || 0) > c.presupuesto);
  if (S.categorias.some(c => c.presupuesto)) out.push(exc.length ? ['receipt', `<b>${exc.length} categoría${exc.length > 1 ? 's' : ''}</b> se pasó del presupuesto: ${exc.slice(0, 3).map(c => esc(c.nombre)).join(', ')}.`, 'bad'] : ['trophy', '<b>Todas las categorías</b> quedaron dentro del presupuesto.', 'ok']);
  out.push(t.aho > 0 ? ['money-bag', `Ahorraron <b>${money(t.aho)}</b>, el ${fmtPct(t.tasa)} de los ingresos.`, 'save'] : ['money-bag', 'Este mes no se registró ahorro. Crea un pago fijo de ahorro para hacerlo automático.', 'warn']);
  return out.slice(0, 6);
}

function repAnual() {
  const y = UI.repAnio; const list = movsAnio(y); const t = totals(list); const tp = totals(movsAnio(y - 1));

  const conDatos = meses.filter(m => m.ing || m.gas).length || 1;
  const gastos = list.filter(m => m.tipo === 'gasto');
  const porCat = byKey(gastos, m => m.categoriaId);
  const rep = reparto(list);
  const activos = meses.map((m, i) => ({ ...m, i })).filter(m => m.ing || m.gas);
  const mejor = [...activos].sort((a, b) => b.disp - a.disp)[0], peor = [...activos].sort((a, b) => b.gas - a.gas)[0];
  const ys = [...new Set(S.movimientos.map(m => +m.fecha.slice(0, 4)).concat([+todayStr().slice(0, 4)]))].sort((a, b) => b - a);
  const maxv = Math.max(...meses.map(m => Math.max(m.ing, m.gas)), 1);

VIEWS.informes.after = () => {
  if (UI.rep === 'diario') {
    const ym = ymOf(UI.repDia); const [y, m] = parseYM(ym); const n = dim(y, m); const sel = +UI.repDia.slice(8);
    const g = Array(n).fill(0); movsMes(ym).forEach(x => { if (x.tipo === 'gasto') g[+x.fecha.slice(8) - 1] += x.monto; });
    const out = cssv('--out');
    chart('ch-dias', { type: 'bar', data: { labels: g.map((_, k) => k + 1), datasets: [{ label: 'Gastos', data: g, backgroundColor: g.map((_, k) => k + 1 === sel ? out : hexA(out, .35)), borderRadius: 6 }] },
      options: { scales: { y: moneyAxis(), x: xAxis() }, plugins: { legend: { display: false } }, onClick: (e, els) => { if (els[0]) { UI.repDia = `${ym}-${pad(els[0].index + 1)}`; render(); } } } });
  } else if (UI.rep === 'mensual') {
    const ym = UI.repMes; const list = movsMes(ym); const gastos = list.filter(m => m.tipo === 'gasto');
    donut('ch-mcat', byKey(gastos, m => m.categoriaId), sum(gastos, m => m.monto));
    const [y, m] = parseYM(ym); const n = dim(y, m); const weeks = Math.ceil(n / 7);
    const wi = Array(weeks).fill(0), wg = Array(weeks).fill(0), wa = Array(weeks).fill(0);
    list.forEach(x => { const w = Math.floor((+x.fecha.slice(8) - 1) / 7); if (x.tipo === 'gasto') wg[w] += x.monto; else if (x.tipo === 'ingreso') wi[w] += x.monto; else if (x.tipo === 'ahorro') wa[w] += ahorroNeto(x); });
    chart('ch-msem', { type: 'bar', data: { labels: wi.map((_, k) => `${k * 7 + 1}–${Math.min(n, k * 7 + 7)} ${MES_C[m - 1]}`), datasets: [
      { label: 'Ingresos', data: wi, backgroundColor: cssv('--in'), borderRadius: 6 }, { label: 'Gastos', data: wg, backgroundColor: cssv('--out'), borderRadius: 6 }, { label: 'Ahorro', data: wa, backgroundColor: cssv('--save'), borderRadius: 6 }] },
      options: { scales: { y: moneyAxis(), x: xAxis() }, plugins: { legend: legendBottom() } } });
  } else {
    const y = UI.repAnio; const list = movsAnio(y);
    const ing = Array(12).fill(0), gas = Array(12).fill(0), aho = Array(12).fill(0);
    list.forEach(x => { const k = +x.fecha.slice(5, 7) - 1; if (x.tipo === 'gasto') gas[k] += x.monto; else if (x.tipo === 'ingreso') ing[k] += x.monto; else if (x.tipo === 'ahorro') aho[k] += ahorroNeto(x); });
    const has = k => ing[k] || gas[k] || aho[k];
    chart('ch-anual', { data: { labels: MES_C, datasets: [
      { type: 'bar', label: 'Ingresos', data: ing, backgroundColor: cssv('--in'), borderRadius: 6, order: 2 },
      { type: 'bar', label: 'Gastos', data: gas, backgroundColor: cssv('--out'), borderRadius: 6, order: 2 },
      { type: 'line', label: 'Ahorro', data: aho.map((v, k) => has(k) ? v : null), borderColor: cssv('--save'), backgroundColor: cssv('--save'), tension: .3, pointRadius: 4, borderWidth: 3, order: 1 }] },
      options: { interaction: { mode: 'index', intersect: false }, scales: { y: moneyAxis(), x: xAxis() }, plugins: { legend: legendBottom() } } });
    const gastos = list.filter(m => m.tipo === 'gasto');
    const top = Object.entries(byKey(gastos, m => m.categoriaId)).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
    const ds = top.map(id => { const d = Array(12).fill(0); gastos.filter(g => g.categoriaId === id).forEach(g => d[+g.fecha.slice(5, 7) - 1] += g.monto); return { label: cat(id).nombre, data: d, backgroundColor: cat(id).color, borderRadius: 3 }; });
    const otros = Array(12).fill(0); gastos.filter(g => !top.includes(g.categoriaId)).forEach(g => otros[+g.fecha.slice(5, 7) - 1] += g.monto);
    if (otros.some(Boolean)) ds.push({ label: 'Otras', data: otros, backgroundColor: cssv('--line'), borderRadius: 3 });
    chart('ch-anual-cat', { type: 'bar', data: { labels: MES_C, datasets: ds }, options: { scales: { x: { ...xAxis(), stacked: true }, y: { ...moneyAxis(), stacked: true } }, plugins: { legend: legendBottom() } } });
  }
};

function applyTheme() {

  if (LOCAL.tema === 'light' || LOCAL.tema === 'dark') r.dataset.theme = LOCAL.tema; else delete r.dataset.theme;
  const a = ACCENTS[isPersonal() ? LOCAL.acentoP : LOCAL.acento] || ACCENTS.verde;
  r.dataset.env = envName();
  const v = x => `--accent:${x[0]};--accent-soft:${x[1]};--accent-fg:${x[2]};`;
  const mix = (p, base) => `color-mix(in srgb, var(--accent) ${p}%, ${base})`;
  const light = `${v(a.l)}--bg:${mix(5, '#f2f4f3')};--surface-2:${mix(4, '#f6f8f7')};--line:${mix(9, '#dbe1de')};`;
  const dark = `${v(a.d)}--bg:${mix(4, '#0d1110')};--surface:${mix(4, '#141917')};--surface-2:${mix(6, '#1a201e')};--line:${mix(9, '#28302c')};`;
  let st = $('#accent-style'); if (!st) { st = document.createElement('style'); st.id = 'accent-style'; document.head.appendChild(st); }
  st.textContent = `:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;

function download(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function csv(list, name) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const tipoL = m => m.tipo === 'ahorro' ? (m.retiro ? 'Retiro de ahorro' : 'Ahorro') : TIPOS_MOV[m.tipo]?.[0] || m.tipo;
  const rows = [['Fecha', 'Tipo', 'Categoría o meta', 'Descripción', 'Persona', 'Cuenta', 'Cuenta destino', 'Valor', 'Notas'].map(q).join(';')];
  [...list].sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => rows.push([m.fecha, tipoL(m),
    m.tipo === 'ahorro' ? (metaOf(m.metaId)?.nombre || 'Ahorro general') : m.tipo === 'transferencia' ? '' : cat(m.categoriaId).nombre,
    movTitle(m), perName(m.personaId), ctaName(m.cuentaId) || m.metodo || '', ctaName(m.cuentaDestinoId),
    String(m.tipo === 'gasto' ? -m.monto : m.monto).replace('.', ','), m.notas].map(q).join(';')));
  download(name, '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast(`Se exportaron ${list.length} movimientos`);
}
$('#import-file').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return; const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.movimientos) || !Array.isArray(d.categorias)) throw new Error();
      confirmBox(`La copia tiene <b>${d.movimientos.length}</b> movimientos. Reemplazará todos los datos actuales.`, 'Restaurar copia', () => { delete d.tema; setS(Object.assign(emptyState(), d)); save(); render(); toast('Copia restaurada'); });
    } catch (err) { toast('Ese archivo no es una copia válida de Cuentas de la Casa'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

function syncErr(e) {

}
function parseFirebaseConfig(text) {
  const o = {}; let m; const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
  while ((m = re.exec(text || ''))) o[m[1]] = m[2];
  if (!o.apiKey || !o.projectId || !o.appId) return null;
  return { apiKey: o.apiKey, authDomain: o.authDomain || `${o.projectId}.firebaseapp.com`, projectId: o.projectId, storageBucket: o.storageBucket || '', messagingSenderId: o.messagingSenderId || '', appId: o.appId };
}
const loadScript = src => new Promise((ok, ko) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(el); });
let fbApp = null;
async function ensureFirebase(conf) {
  if (!window.firebase || !firebase.firestore) {
    await loadScript('vendor/firebase-app-compat.js'); await loadScript('vendor/firebase-auth-compat.js'); await loadScript('vendor/firebase-firestore-compat.js');
  }
  if (fbApp && fbApp.options.projectId !== conf.projectId) { location.reload(); throw new Error('Reiniciando con el nuevo proyecto…'); }
  if (!fbApp) {
    fbApp = firebase.initializeApp(conf); SYNC.db = firebase.firestore();
    if (window.CUENTAS_EMULADOR) { firebase.auth().useEmulator('http://127.0.0.1:9099'); SYNC.db.useEmulator('127.0.0.1', 8080); } // solo para pruebas locales
    try { await SYNC.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* otra pestaña ya la tiene o el navegador no la admite */ }
  }
  if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
}

let remoteT;
function remoteChanged() {
  clearTimeout(remoteT);
  remoteT = setTimeout(() => {
    saveLocal('hogar'); if (!isPersonal()) render();
    if (SYNC.preguntarYo && DATA.hogar.personas.length && !per(LOCAL.yo)) { SYNC.preguntarYo = false; if (!dlg.open) quienSoy(); }
  }, 120);
}
async function startSync() {
  const c = SYNC.conf; if (!c) { setEstado('local'); return; }
  setEstado('conectando');
  try {
    await ensureFirebase(c.firebase);
    SYNC.unsub.forEach(u => u()); SYNC.unsub = [];
    SYNC.ref = SYNC.db.collection('hogares').doc(c.codigo);
    SYNC.on = true; DATA.hogar.ejemplo = false;
    SYNC.unsub.push(SYNC.ref.onSnapshot({ includeMetadataChanges: true }, snap => {
      if (!snap.exists) { if (!snap.metadata.fromCache) { setEstado('error'); toast('Este hogar ya no existe en la nube. Revisa Ajustes.'); } return; }
      const d = snap.data();
      CFG_KEYS.forEach(k => { if (d[k] !== undefined) { const j = canon(d[k]); if (SYNC.last.cfg[k] !== j) { DATA.hogar[k] = d[k]; SYNC.last.cfg[k] = j; } } });
      setEstado(snap.metadata.fromCache || !navigator.onLine ? 'offline' : 'ok');
      remoteChanged();
    }, err => { setEstado('error'); toast(syncErr(err)); }));
    SYNC.unsub.push(SYNC.ref.collection('movimientos').onSnapshot(snap => {
      DATA.hogar.movimientos = snap.docs.map(x => x.data());
      SYNC.last.movs = new Map(DATA.hogar.movimientos.map(m => [m.id, canon(m)]));
      remoteChanged();
    }, err => { setEstado('error'); toast(syncErr(err)); }));
  } catch (e) { setEstado('error'); toast(syncErr(e)); }
}
function pushChanges() {
  if (!SYNC.ref) return;
  const ops = []; const col = SYNC.ref.collection('movimientos');
  const cur = new Map(DATA.hogar.movimientos.map(m => [m.id, m]));
  cur.forEach((m, id) => { const j = canon(m); if (SYNC.last.movs.get(id) !== j) { ops.push(b => b.set(col.doc(id), clean(m))); SYNC.last.movs.set(id, j); } });
  [...SYNC.last.movs.keys()].forEach(id => { if (!cur.has(id)) { ops.push(b => b.delete(col.doc(id))); SYNC.last.movs.delete(id); } });
  const upd = {}; CFG_KEYS.forEach(k => { const j = canon(DATA.hogar[k]); if (SYNC.last.cfg[k] !== j) { upd[k] = clean(DATA.hogar[k] ?? null); SYNC.last.cfg[k] = j; } });
  if (Object.keys(upd).length) { upd.actualizado = firebase.firestore.FieldValue.serverTimestamp(); ops.push(b => b.update(SYNC.ref, upd)); }
  for (let i = 0; i < ops.length; i += 450) { const b = SYNC.db.batch(); ops.slice(i, i + 450).forEach(f => f(b)); b.commit().catch(e => { setEstado('error'); toast(syncErr(e)); }); }
}
async function crearHogar(fbConf, subirDatos) {
  if (!navigator.onLine) throw new Error('Necesitas internet para crear el hogar compartido.');
  await ensureFirebase(fbConf);
  if (!subirDatos || DATA.hogar.ejemplo) { const keep = { hogar: DATA.hogar.ejemplo ? 'Mi casa' : DATA.hogar.hogar, moneda: DATA.hogar.moneda }; setHogar(Object.assign(emptyState(), keep)); }
  const codigo = randomCode(); const ref = SYNC.db.collection('hogares').doc(codigo);
  const cfg = {}; CFG_KEYS.forEach(k => cfg[k] = clean(DATA.hogar[k])); cfg.creado = firebase.firestore.FieldValue.serverTimestamp();
  await ref.set(cfg);
  const movs = DATA.hogar.movimientos;
  for (let i = 0; i < movs.length; i += 450) { const b = SYNC.db.batch(); movs.slice(i, i + 450).forEach(m => b.set(ref.collection('movimientos').doc(m.id), clean(m))); await b.commit(); }
  SYNC.conf = { firebase: fbConf, codigo }; lsSet(SYNC_KEY, SYNC.conf);
  SYNC.last = { movs: new Map(movs.map(m => [m.id, canon(m)])), cfg: Object.fromEntries(CFG_KEYS.map(k => [k, canon(DATA.hogar[k])])) };
  await startSync();
}
async function unirseHogar(fbConf, codigo) {
  if (!navigator.onLine) throw new Error('Necesitas internet para unirte al hogar.');
  await ensureFirebase(fbConf);
  const snap = await SYNC.db.collection('hogares').doc(codigo).get({ source: 'server' });
  if (!snap.exists) throw new Error('No existe un hogar con ese enlace. Pide uno nuevo.');
  setHogar(emptyState()); SYNC.last = { movs: new Map(), cfg: {} };
  SYNC.conf = { firebase: fbConf, codigo }; lsSet(SYNC_KEY, SYNC.conf);
  SYNC.preguntarYo = true;
  await startSync();
}
function salirHogar() {
  SYNC.unsub.forEach(u => u()); SYNC.unsub = []; SYNC.on = false; SYNC.ref = null; SYNC.conf = null; SYNC.last = { movs: new Map(), cfg: {} };
  lsSet(SYNC_KEY, null); setEstado('local'); saveLocal('hogar'); render();
}
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = t => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g, '+').replace(/_/g, '/')))));
const inviteLink = () => `${location.origin}${location.pathname}#unirse=${enc({ f: SYNC.conf.firebase, c: SYNC.conf.codigo, n: DATA.hogar.hogar })}`;
const isOnline = () => location.protocol.startsWith('http');

function invitacion(token) {
  let d; try { d = dec(token.includes('unirse=') ? token.split('unirse=')[1] : token); } catch (e) { toast('El enlace de invitación está incompleto. Pide que te lo envíen de nuevo.'); return; }
  if (SYNC.conf && SYNC.conf.codigo === d.c) { toast('Este teléfono ya está en ese hogar'); return; }
  openModal(`Unirte a “${esc(d.n || 'el hogar')}”`, `
    <p>Este teléfono verá y registrará los mismos gastos e ingresos que el resto del hogar, en tiempo real.</p>
    ${DATA.hogar.movimientos.length && !DATA.hogar.ejemplo ? `<div class="banner warn">${ic('triangle-alert')}<div class="grow small">Los datos que tienes ahora en este teléfono se reemplazarán por los del hogar. Si quieres conservarlos, descarga una copia antes desde Ajustes.</div></div>` : ''}
    <p class="small out" id="un-err" hidden></p>`,
    `<button class="btn" data-act="close">Ahora no</button><button class="btn primary" id="un-ok">${ic('users')}Unirme</button>`,
    () => { $('#un-ok').onclick = async () => { const b = $('#un-ok'); b.disabled = true; b.textContent = 'Uniendo…';
      try { await unirseHogar(d.f, d.c); if ($('#un-ok')) closeModal(); toast('¡Listo! Ya estás en el hogar'); }
      catch (e) { const er = $('#un-err'); er.textContent = e.code ? syncErr(e) : e.message; er.hidden = false; b.disabled = false; b.textContent = 'Reintentar'; } }; });
}
function quienSoy() {
  openModal('¿Quién usa este teléfono?', `<p class="small muted">Así, cuando registres un gasto, aparecerás como quien pagó. Lo puedes cambiar en Ajustes.</p>
    <div class="list">${DATA.hogar.personas.map(p => `<button type="button" class="btn" style="justify-content:flex-start" data-act="set-yo" data-id="${p.id}">${avatar(p, true)}${esc(p.nombre)}</button>`).join('')}</div>`,
    `<button class="btn" data-act="close">Omitir</button>`);
}
function personalCard() {
  const hp = DATA.hogar.personas;
  return `<section class="card"><div class="card-h"><h2>${ic('lock')}Privacidad</h2><span class="pill save">Solo en este teléfono</span></div>
    <div class="insights">
      <div class="insight" style="--t:var(--save)">${pic('locked', 30)}<p>Lo que registras aquí <b>no se comparte</b> con nadie del hogar ni se sube a la nube.</p></div>
      <div class="insight" style="--t:var(--accent)">${pic('house-with-garden', 30)}<p>Cuando des plata para la casa, marca <b>“Es un aporte para la casa”</b> al registrar el gasto y aparecerá también en Hogar.</p></div>
    </div>
    ${hp.length ? `<div class="field"><label for="s-yo2">En el hogar, mis aportes van a nombre de</label><select class="input" id="s-yo2" data-yo="1"><option value="">Nadie en particular</option>${hp.map(p => `<option value="${p.id}" ${LOCAL.yo === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>` : ''}
  </section>`;
}
function familiaCard() {
  const inst = isStandalone() ? `<span class="pill ok">${ic('check')}Ya está instalada en este teléfono</span>`
    : installEvt ? `<button class="btn primary" data-act="install">${ic('download')}Instalar en este teléfono</button>`
    : isIOS ? `<ol class="steps"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> ${ic('share')}.</li><li>Elige <b>Agregar a pantalla de inicio</b>.</li></ol>`
    : isOnline() ? `<ol class="steps"><li>Abre el menú del navegador (⋮).</li><li>Toca <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</li></ol>`
    : `<p class="small muted">Para instalarla, primero hay que publicarla en internet. Los pasos están en el archivo README.md.</p>`;
  const yo = `<div class="field"><label for="s-yo">En este teléfono soy</label><select class="input" id="s-yo" data-yo="1"><option value="">Nadie en particular</option>${DATA.hogar.personas.map(p => `<option value="${p.id}" ${LOCAL.yo === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>`;
  return `<div class="grid g2">
    <section class="card"><div class="card-h"><h2>${ic('users')}Compartir con la familia</h2>${syncBadge()}</div>
    ${SYNC.conf ? `
      <p class="small muted">Todos los teléfonos que se unan con el enlace ven y registran lo mismo, aunque estén lejos. Sin internet se sigue usando y se sincroniza al volver la conexión.</p>
      <div class="field"><label>Código del hogar</label><div class="code">${esc(SYNC.conf.codigo)}</div></div>
      ${isOnline() ? `<div class="inline"><button class="btn primary" data-act="copy-invite">${ic('link')}Copiar enlace de invitación</button>${navigator.share ? `<button class="btn" data-act="share-invite">${ic('share-2')}Enviar por WhatsApp u otra app</button>` : ''}</div>
      <input class="input small" id="invite-text" readonly hidden>` : `<p class="small warn">Publica la app en internet para poder invitar a otros teléfonos.</p>`}
      <p class="small muted">Quien tenga el enlace puede ver y cambiar las cuentas. Compártelo solo con tu familia.</p>
      ${yo}
      <div><button class="btn sm ghost" data-act="leave-sync">${ic('log-out')}Dejar de sincronizar en este teléfono</button></div>`
    : `
      <p class="small muted">Ahora los datos están solo en este teléfono. Crea un hogar compartido para que cada persona registre desde su celular y todos vean lo mismo.</p>
      <div class="inline"><button class="btn primary" data-act="create-sync">${ic('cloud-upload')}Crear hogar compartido</button><button class="btn" data-act="join-sync">${ic('link')}Tengo un enlace de invitación</button></div>
      ${DATA.hogar.personas.length ? yo : ''}`}
    </section>
    <section class="card"><div class="card-h"><h2>${ic('smartphone')}Instalar como app</h2></div>
      <p class="small muted">Queda con su propio icono en la pantalla de inicio, abre a pantalla completa y funciona sin conexión.</p>${inst}</section>
  </div>`;
}
function crearForm() {
  openModal('Crear hogar compartido', `
    <ol class="steps">
      <li>Entra a <b>console.firebase.google.com</b> y crea un proyecto gratuito.</li>
      <li>En <b>Authentication → Método de acceso</b>, activa <b>Anónimo</b>.</li>
      <li>En <b>Firestore Database</b>, crea la base de datos y pega las reglas del archivo <b>firestore.rules</b> en la pestaña Reglas.</li>
      <li>En <b>Configuración del proyecto → Tus apps</b>, agrega una app web (&lt;/&gt;) y copia el bloque <code>firebaseConfig</code>.</li>
    </ol>
    <div class="field"><label for="cr-conf">Pega aquí la configuración de Firebase</label><textarea class="input" id="cr-conf" rows="6" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };'></textarea></div>
    ${DATA.hogar.ejemplo ? '<p class="small muted">Los datos de ejemplo no se suben: el hogar empieza vacío.</p>' : `<label class="inline small"><input type="checkbox" id="cr-subir" checked> Subir los datos que ya tengo en este teléfono (${DATA.hogar.movimientos.length} movimientos)</label>`}
    <p class="small out" id="cr-err" hidden></p>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="cr-ok">${ic('cloud-upload')}Crear hogar</button>`,
    () => { $('#cr-ok').onclick = async () => {
      const er = $('#cr-err'); const conf = parseFirebaseConfig(fv('cr-conf'));
      if (!conf) { er.textContent = 'No encontré apiKey, projectId y appId en lo que pegaste. Copia el bloque firebaseConfig completo.'; er.hidden = false; return; }
      const b = $('#cr-ok'); b.disabled = true; b.textContent = 'Creando…';
      try { await crearHogar(conf, $('#cr-subir')?.checked); if ($('#cr-ok')) closeModal(); render(); toast('Hogar compartido creado. Ahora invita a tu familia'); }
      catch (e) { er.textContent = e.code ? syncErr(e) : e.message; er.hidden = false; b.disabled = false; b.textContent = 'Reintentar'; setEstado(SYNC.on ? SYNC.estado : 'local'); }
    }; });
}

let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#install-btn').hidden = false; if (UI.view === 'ajustes') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#install-btn').hidden = true; toast('App instalada'); });
window.addEventListener('online', () => SYNC.on && setEstado('ok'));
window.addEventListener('offline', () => SYNC.on && setEstado('offline'));
document.addEventListener('change', e => { if (e.target.dataset.yo) { LOCAL.yo = e.target.value; lsSet(LOCAL_KEY, LOCAL); toast('Listo'); } });

Object.assign(ACT, {
  'install': async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install-btn').hidden = true; render(); },
  'create-sync': () => { if (!isOnline()) { toast('Primero publica la app en internet (ver README.md)'); return; } crearForm(); },
  'join-sync': () => openModal('Unirme a un hogar', `<div class="field"><label for="jn-link">Pega el enlace de invitación que te enviaron</label><textarea class="input" id="jn-link" rows="4"></textarea></div><p class="small muted">Lo más fácil es abrir el enlace directamente desde WhatsApp o el correo.</p>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="jn-ok">${ic('link')}Continuar</button>`,
    () => { $('#jn-ok').onclick = () => { const t = fv('jn-link').trim(); closeModal(); invitacion(t); }; }),
  'copy-invite': () => { const link = inviteLink(); const inp = $('#invite-text');
    navigator.clipboard.writeText(link).then(() => toast('Enlace copiado. Envíalo a tu familia'))
      .catch(() => { inp.value = link; inp.hidden = false; inp.select(); toast('Copia el enlace que aparece seleccionado'); }); },
  'share-invite': () => navigator.share({ title: 'Cuentas de la Casa', text: `Únete a las cuentas de ${DATA.hogar.hogar}:`, url: inviteLink() }).catch(() => {}),
  'leave-sync': () => confirmBox('Este teléfono dejará de recibir y enviar cambios. Conserva una copia local de los datos y el hogar sigue igual para los demás.', 'Dejar de sincronizar', salirHogar),
  'set-yo': d => { LOCAL.yo = d.id; lsSet(LOCAL_KEY, LOCAL); closeModal(); toast(`Hola, ${perName(d.id)}`); },
});

if ('serviceWorker' in navigator && isOnline()) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__syncReady = true;
setEstado('local');
startSync();

applyTheme();
route();
</script>
