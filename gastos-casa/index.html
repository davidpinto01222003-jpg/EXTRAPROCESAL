<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de la Casa</title>
<meta name="description" content="Gastos, ingresos, aportes e informes del hogar, compartidos con toda la familia.">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas Casa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fija con la navegación + área de trabajo en tarjetas; en móvil la barra pasa arriba y aparece un botón flotante para registrar. */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f5f8f6; --line:#d9e2dc;
  --fg:#142019; --muted:#5b6b62; --accent:#0f6b4f; --accent-fg:#ffffff; --accent-soft:#d6ebe1;
  --in:#1b8657; --in-soft:#dcf1e6; --out:#bf4338; --out-soft:#f8e1de; --warn:#a86b12; --warn-soft:#f8ecd4;
  --gold:#d6992a; --shadow:0 1px 2px rgba(20,32,25,.06),0 6px 20px rgba(20,32,25,.06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --line:#29352f;
    --fg:#e5eee8; --muted:#93a39a; --accent:#4cc495; --accent-fg:#06281b; --accent-soft:#1c3a2d;
    --in:#4cc495; --in-soft:#173527; --out:#f07a6e; --out-soft:#3d1f1c; --warn:#e7b45c; --warn-soft:#3a2d14;
    --gold:#e7b45c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --line:#29352f;
  --fg:#e5eee8; --muted:#93a39a; --accent:#4cc495; --accent-fg:#06281b; --accent-soft:#1c3a2d;
  --in:#4cc495; --in-soft:#173527; --out:#f07a6e; --out-soft:#3d1f1c; --warn:#e7b45c; --warn-soft:#3a2d14;
  --gold:#e7b45c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.in{color:var(--in)} .out{color:var(--out)}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand-mark svg.lucide{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.1rem;display:block;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.side-foot .pill{white-space:normal}
.install-btn{margin-top:auto}
.install-btn + .side-foot{margin-top:0}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:1.05rem;letter-spacing:.06em;background:var(--surface-2);border:1px dashed var(--line);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.pill svg.lucide{width:13px;height:13px}
.main{padding-block:28px 96px;padding-inline:clamp(16px,3vw,40px);min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:8px}
.card-h h2 svg.lucide{color:var(--accent)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600;font-size:.88rem}
.kpi-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.kpi-v{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.hero .kpi-top{color:inherit;opacity:.85}
.kpi.hero .kpi-ic{background:rgba(255,255,255,.18)}
.delta{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta svg.lucide{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)}
.pill.bad{background:var(--out-soft);color:var(--out)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar.lg{height:12px}
.cat-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:.95rem}
.avatar.sm{width:26px;height:26px;font-size:.72rem}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1;min-width:200px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg.lucide{width:30px;height:30px}

/* listas de movimientos */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:2px}
.day-h{display:flex;justify-content:space-between;gap:10px;padding:14px 4px 6px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}

/* tablas */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
tr.sel td{background:var(--accent-soft)}
tbody tr:hover td{background:var(--surface-2)}

/* formularios */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{flex:1 1 150px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.type button.on[data-v="gasto"]{color:var(--out)}
.seg.type button.on[data-v="ingreso"]{color:var(--in)}
.month-nav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.month-nav b{min-width:130px;text-align:center;font-family:var(--f-display)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.amount-input{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icon-grid button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;display:grid;place-items:center}
.icon-grid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--fg)}

/* modal */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.modal{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.modal-b{padding:12px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}

.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 28px rgba(15,107,79,.35);cursor:pointer;display:grid;place-items:center;z-index:20}
.fab svg.lucide{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.chart-box{position:relative;height:260px;min-width:0}
.chart-box.sm{height:210px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:.9rem;min-width:0}
.legend-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person-card{display:flex;flex-direction:column;gap:12px}
.stat-line{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.stat-line b{font-variant-numeric:tabular-nums}
.goal-ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.goal-ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.print-only{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 16px;z-index:15;border-right:0;border-bottom:1px solid var(--line);gap:12px}
  .brand div{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav a{padding:8px 10px}
  .nav a span{display:none}
  .nav a.on span{display:inline}
  .side-foot{display:none}
  .install-btn{margin-top:0;padding:7px}
  .install-btn span{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi-v{font-size:1.25rem}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.45rem}
  .btn{white-space:normal;text-align:left}
  .row .avatar.sm{display:none}
  .row.wrap{flex-wrap:wrap}
  .row.wrap .grow{flex-basis:calc(100% - 48px)}
  .row .acts .icon-btn{padding:4px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
@media print{
  .side,.fab,.head-actions,.no-print{display:none!important}
  .app{display:block}
  .main{padding:0}
  .card,.kpi{break-inside:avoid;box-shadow:none}
  .print-only{display:block}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="house"></i></div>
      <div><b id="brand-name">Cuentas de la Casa</b><span>Finanzas del hogar</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#inicio" data-v="inicio"><i data-lucide="layout-dashboard"></i><span>Inicio</span></a>
      <a href="#movimientos" data-v="movimientos"><i data-lucide="arrow-left-right"></i><span>Movimientos</span></a>
      <a href="#informes" data-v="informes"><i data-lucide="chart-column"></i><span>Informes</span></a>
      <a href="#personas" data-v="personas"><i data-lucide="users"></i><span>Personas</span></a>
      <a href="#categorias" data-v="categorias"><i data-lucide="tags"></i><span>Presupuesto</span></a>
      <a href="#fijos" data-v="fijos"><i data-lucide="calendar-clock"></i><span>Pagos fijos</span></a>
      <a href="#metas" data-v="metas"><i data-lucide="piggy-bank"></i><span>Metas de ahorro</span></a>
      <a href="#ajustes" data-v="ajustes"><i data-lucide="settings"></i><span>Ajustes y copias</span></a>
    </nav>
    <button class="btn sm install-btn" id="install-btn" data-act="install" hidden><i data-lucide="download"></i><span>Instalar app</span></button>
    <div class="side-foot" id="sync-status"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<button class="fab" data-act="new-mov" aria-label="Registrar movimiento" title="Registrar movimiento"><i data-lucide="plus"></i></button>
<dialog id="dlg"><div class="modal" id="dlg-body"></div></dialog>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/lucide.min.js"></script>
<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const METODOS = ['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','Billetera digital','Otro'];
const COLORS = ['#0f6b4f','#3b6fd8','#c2453a','#d6992a','#8b5cf6','#0e9aa7','#e0607e','#6b8e23','#b5651d','#5a6b7b','#2f9e44','#cc5de8'];
const ICONS = ['house','zap','droplets','flame','wifi','smartphone','tv','shopping-cart','utensils','coffee','car','bus','fuel','heart-pulse','pill','graduation-cap','book-open','baby','shirt','film','music','plane','dumbbell','dog','wrench','sofa','shield','credit-card','landmark','receipt','gift','package','leaf','briefcase','sparkles','trending-up','hand-coins','coins','wallet','piggy-bank','building-2','laptop'];

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymOf = s => s.slice(0, 7);
const dim = (y, m) => new Date(y, m, 0).getDate();
const parseYM = ym => ym.split('-').map(Number);
const shiftYM = (ym, k) => { const [y, m] = parseYM(ym); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const ymLabel = ym => { const [y, m] = parseYM(ym); return `${MESES[m - 1]} ${y}`; };

const money = (n, opts = {}) => {
  const dec = ['COP', 'CLP', 'PYG'].includes(S.moneda) ? 0 : 2;
  try { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: S.moneda, maximumFractionDigits: dec, minimumFractionDigits: opts.short ? 0 : dec }).format(n || 0); }
  catch (e) { return (n || 0).toFixed(dec); }
};
const moneyShort = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.', ',') + ' mil M';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' M';
  if (a >= 1e3) return Math.round(n / 1e3) + ' mil';
  return String(Math.round(n));
};
const pct = (a, b) => b ? a / b * 100 : 0;
const fmtPct = n => `${(Math.round(n * 10) / 10).toString().replace('.', ',')} %`;
const movsMes = ym => S.movimientos.filter(m => m.fecha.startsWith(ym));
const movsAnio = y => S.movimientos.filter(m => m.fecha.startsWith(String(y)));
const totals = list => { const ing = sum(list.filter(m => m.tipo === 'ingreso'), m => m.monto); const gas = sum(list.filter(m => m.tipo === 'gasto'), m => m.monto); return { ing, gas, bal: ing - gas, ahorro: ing ? (ing - gas) / ing * 100 : 0 }; };
const byKey = (list, keyFn) => { const o = {}; list.forEach(m => { const k = keyFn(m); o[k] = (o[k] || 0) + m.monto; }); return o; };
const sortDesc = (a, b) => (b.fecha + b.id).localeCompare(a.fecha + a.id);

/* reparto de gastos entre personas según porcentaje acordado */
function reparto(list) {
  const gastos = list.filter(m => m.tipo === 'gasto');
  const total = sum(gastos, m => m.monto);
  const totalPct = sum(S.personas, p => p.porcentaje);
  const rows = S.personas.map(p => {
    const pagado = sum(gastos.filter(m => m.personaId === p.id), m => m.monto);
    const aportado = sum(list.filter(m => m.tipo === 'ingreso' && m.personaId === p.id), m => m.monto);
    const cuota = totalPct ? total * p.porcentaje / totalPct : 0;
    return { p, pagado, aportado, cuota, dif: pagado - cuota };
  });
  // ajuste de cuentas: quién le paga a quién
  const deud = rows.filter(r => r.dif < -1).map(r => ({ p: r.p, v: -r.dif })).sort((a, b) => b.v - a.v);
  const acre = rows.filter(r => r.dif > 1).map(r => ({ p: r.p, v: r.dif })).sort((a, b) => b.v - a.v);
  const pagos = []; let i = 0, j = 0;
  while (i < deud.length && j < acre.length) {
    const v = Math.min(deud[i].v, acre[j].v);
    if (v > 1) pagos.push({ de: deud[i].p, a: acre[j].p, v });
    deud[i].v -= v; acre[j].v -= v;
    if (deud[i].v <= 1) i++; if (acre[j].v <= 1) j++;
  }
  return { total, totalPct, rows, pagos, comun: sum(gastos.filter(m => !per(m.personaId)), m => m.monto) };
}

VIEWS.inicio.after = () => {

  chart('ch-cat', { type: 'doughnut', data: { labels: porCat.map(([id]) => cat(id).nombre), datasets: [{ data: porCat.map(x => x[1]), backgroundColor: porCat.map(([id]) => cat(id).color), borderColor: cssv('--surface'), borderWidth: 2 }] },
    options: { cutout: '68%', plugins: { legend: { display: false } } } });
  const [y, m] = parseYM(ym); const n = dim(y, m); const isCur = ym === ymOf(todayStr()); const last = isCur ? +todayStr().slice(8) : n;
  const daily = Array(n).fill(0); gastos.forEach(g => daily[+g.fecha.slice(8) - 1] += g.monto);
  let acc = 0; const acum = daily.map((v, i) => i < last ? (acc += v) : null);
  const pres = sum(S.categorias.filter(c => c.tipo === 'gasto'), c => c.presupuesto);
  const ds = [{ type: 'line', label: 'Gasto acumulado', data: acum, borderColor: cssv('--accent'), backgroundColor: cssv('--accent-soft'), fill: true, tension: .25, pointRadius: 0, pointHoverRadius: 4, borderWidth: 2.5 },
    { type: 'bar', label: 'Gasto del día', data: daily.map((v, i) => i < last ? v : null), backgroundColor: cssv('--out') + '66', borderRadius: 4, barPercentage: .7 }];
  if (pres) ds.push({ type: 'line', label: 'Presupuesto', data: Array(n).fill(pres), borderColor: cssv('--warn'), borderDash: [6, 5], pointRadius: 0, borderWidth: 1.5, fill: false });
  chart('ch-acum', { data: { labels: daily.map((_, i) => i + 1), datasets: ds }, options: { interaction: { mode: 'index', intersect: false }, scales: { y: moneyAxis(), x: { grid: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });

  let acc = 0;
  return `
  <div class="inline no-print"><div class="field"><label for="rep-anio">Año</label><select class="input" id="rep-anio" data-r="repAnio">${ys.map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
  <h2>Informe anual ${y}</h2>
  <div class="grid g4">
    ${kpi('Ingresos del año', money(t.ing), 'arrow-down-left', 'in', tp.ing ? `<span class="delta" style="color:var(${t.ing >= tp.ing ? '--in' : '--out'})">${fmtPct(Math.abs(pct(t.ing - tp.ing, tp.ing)))} ${t.ing >= tp.ing ? 'más' : 'menos'} que ${y - 1}</span>` : '')}
    ${kpi('Gastos del año', money(t.gas), 'arrow-up-right', 'out', tp.gas ? `<span class="delta" style="color:var(${t.gas <= tp.gas ? '--in' : '--out'})">${fmtPct(Math.abs(pct(t.gas - tp.gas, tp.gas)))} ${t.gas >= tp.gas ? 'más' : 'menos'} que ${y - 1}</span>` : '')}
    ${kpi('Ahorro del año', money(t.bal), 'piggy-bank', t.bal >= 0 ? 'in' : 'out', `<span class="small muted">${fmtPct(t.ahorro)} de los ingresos</span>`)}
    ${kpi('Gasto promedio mensual', money(t.gas / conDatos), 'calendar-range', 'warn', mejor.length ? `<span class="small muted">Mejor mes: ${MESES[mejor[0].i]}</span>` : '')}
  </div>
  <section class="card"><div class="card-h"><h2>${ic('chart-column')}Ingresos y gastos mes a mes</h2></div><div class="chart-box" style="height:300px"><canvas id="ch-anual"></canvas></div></section>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>${ic('table')}Resumen mensual ${y}</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Balance</th><th class="r">Ahorro acumulado</th></tr></thead><tbody>
      ${meses.map((m, i) => { acc += m.bal; return `<tr data-act="go-mes" data-ym="${y}-${pad(i + 1)}" style="cursor:pointer"><td>${MESES[i]}</td><td class="r in">${m.ing ? money(m.ing) : '—'}</td><td class="r out">${m.gas ? money(m.gas) : '—'}</td><td class="r ${m.bal >= 0 ? '' : 'out'}">${m.ing || m.gas ? money(m.bal) : '—'}</td><td class="r ${acc >= 0 ? 'in' : 'out'}">${m.ing || m.gas ? money(acc) : '—'}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="r in">${money(t.ing)}</td><td class="r out">${money(t.gas)}</td><td class="r">${money(t.bal)}</td><td></td></tr></tfoot></table></div></section>
    <section class="card"><div class="card-h"><h2>${ic('tags')}Gastos del año por categoría</h2></div>
      ${cats.length ? `<div class="tbl-wrap"><table><thead><tr><th>Categoría</th><th class="r">Total</th><th class="r">Prom. mensual</th><th class="r">%</th></tr></thead><tbody>
      ${cats.map(([id, v]) => { const c = cat(id); return `<tr><td><span class="inline" style="flex-wrap:nowrap">${catIcon(c, 26)}${esc(c.nombre)}</span></td><td class="r">${money(v)}</td><td class="r muted">${money(v / conDatos)}</td><td class="r">${fmtPct(pct(v, t.gas))}</td></tr>`; }).join('')}
      </tbody></table></div>` : empty('receipt', 'Sin gastos en este año.')}</section>
  </div>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>${ic('chart-bar-stacked')}Categorías principales por mes</h2></div><div class="chart-box" style="height:300px"><canvas id="ch-anual-cat"></canvas></div></section>
    ${S.personas.length ? `<section class="card"><div class="card-h"><h2>${ic('users')}Aportes por persona en ${y}</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>Persona</th><th class="r">Ingresos aportados</th><th class="r">Gastos pagados</th><th class="r">% de los gastos</th><th class="r">Diferencia</th></tr></thead><tbody>
      ${rep.rows.map(r => `<tr><td><span class="inline" style="flex-wrap:nowrap">${avatar(r.p, true)}${esc(r.p.nombre)}</span></td><td class="r in">${money(r.aportado)}</td><td class="r">${money(r.pagado)}</td><td class="r">${fmtPct(pct(r.pagado, rep.total))}</td><td class="r ${r.dif >= 0 ? 'in' : 'out'}">${r.dif >= 0 ? '+' : '−'}${money(Math.abs(r.dif))}</td></tr>`).join('')}
      </tbody></table></div><div class="chart-box sm"><canvas id="ch-anual-per"></canvas></div></section>` : ''}
  </div>`;
}

VIEWS.informes.after = () => {
  if (UI.rep === 'diario') {
    const ym = ymOf(UI.repDia); const [y, m] = parseYM(ym); const n = dim(y, m); const sel = +UI.repDia.slice(8);
    const g = Array(n).fill(0), i = Array(n).fill(0);
    movsMes(ym).forEach(x => (x.tipo === 'gasto' ? g : i)[+x.fecha.slice(8) - 1] += x.monto);
    chart('ch-dias', { type: 'bar', data: { labels: g.map((_, k) => k + 1), datasets: [{ label: 'Gastos', data: g, backgroundColor: g.map((_, k) => k + 1 === sel ? cssv('--out') : cssv('--out') + '55'), borderRadius: 4 }] },
      options: { scales: { y: moneyAxis(), x: { grid: { display: false } } }, plugins: { legend: { display: false } }, onClick: (e, els) => { if (els[0]) { UI.repDia = `${ym}-${pad(els[0].index + 1)}`; render(); } } } });
  } else if (UI.rep === 'mensual') {
    const ym = UI.repMes; const list = movsMes(ym); const gastos = list.filter(m => m.tipo === 'gasto');
    const cats = Object.entries(byKey(gastos, m => m.categoriaId)).sort((a, b) => b[1] - a[1]);
    chart('ch-mcat', { type: 'bar', data: { labels: cats.map(([id]) => cat(id).nombre), datasets: [{ data: cats.map(x => x[1]), backgroundColor: cats.map(([id]) => cat(id).color), borderRadius: 5 }] },
      options: { indexAxis: 'y', scales: { x: moneyAxis(), y: { grid: { display: false }, ticks: { autoSkip: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => money(c.parsed.x) } } } } });
    const [y, m] = parseYM(ym); const n = dim(y, m); const weeks = Math.ceil(n / 7);
    const wi = Array(weeks).fill(0), wg = Array(weeks).fill(0);
    list.forEach(x => { const w = Math.floor((+x.fecha.slice(8) - 1) / 7); (x.tipo === 'gasto' ? wg : wi)[w] += x.monto; });
    chart('ch-msem', { type: 'bar', data: { labels: wi.map((_, k) => `Días ${k * 7 + 1}–${Math.min(n, k * 7 + 7)}`), datasets: [{ label: 'Ingresos', data: wi, backgroundColor: cssv('--in'), borderRadius: 5 }, { label: 'Gastos', data: wg, backgroundColor: cssv('--out'), borderRadius: 5 }] },
      options: { scales: { y: moneyAxis(), x: { grid: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });
  } else {
    const y = UI.repAnio; const list = movsAnio(y);
    const ing = Array(12).fill(0), gas = Array(12).fill(0);
    list.forEach(x => (x.tipo === 'gasto' ? gas : ing)[+x.fecha.slice(5, 7) - 1] += x.monto);
    chart('ch-anual', { data: { labels: MES_C, datasets: [
      { type: 'bar', label: 'Ingresos', data: ing, backgroundColor: cssv('--in'), borderRadius: 5, order: 2 },
      { type: 'bar', label: 'Gastos', data: gas, backgroundColor: cssv('--out'), borderRadius: 5, order: 2 },
      { type: 'line', label: 'Balance', data: ing.map((v, k) => v || gas[k] ? v - gas[k] : null), borderColor: cssv('--gold'), backgroundColor: cssv('--gold'), tension: .3, pointRadius: 3, order: 1 }] },
      options: { interaction: { mode: 'index', intersect: false }, scales: { y: moneyAxis(), x: { grid: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });
    const gastos = list.filter(m => m.tipo === 'gasto');
    const top = Object.entries(byKey(gastos, m => m.categoriaId)).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
    const ds = top.map(id => { const d = Array(12).fill(0); gastos.filter(g => g.categoriaId === id).forEach(g => d[+g.fecha.slice(5, 7) - 1] += g.monto); return { label: cat(id).nombre, data: d, backgroundColor: cat(id).color, borderRadius: 2 }; });
    const otros = Array(12).fill(0); gastos.filter(g => !top.includes(g.categoriaId)).forEach(g => otros[+g.fecha.slice(5, 7) - 1] += g.monto);
    if (otros.some(Boolean)) ds.push({ label: 'Otras', data: otros, backgroundColor: cssv('--line') });
    chart('ch-anual-cat', { type: 'bar', data: { labels: MES_C, datasets: ds }, options: { scales: { x: { stacked: true, grid: { display: false } }, y: { ...moneyAxis(), stacked: true } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } } } });
    if (S.personas.length) {
      const rep = reparto(list);
      chart('ch-anual-per', { type: 'bar', data: { labels: rep.rows.map(r => r.p.nombre), datasets: [{ label: 'Ingresos aportados', data: rep.rows.map(r => r.aportado), backgroundColor: cssv('--in'), borderRadius: 5 }, { label: 'Gastos pagados', data: rep.rows.map(r => r.pagado), backgroundColor: cssv('--out'), borderRadius: 5 }] },
        options: { scales: { y: moneyAxis(), x: { grid: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });
    }
  }
};

VIEWS.personas = () => {
  const ym = UI.mes; const list = movsMes(ym); const rep = reparto(list); const ya = totals(movsAnio(+ym.slice(0, 4)));
  const repA = reparto(movsAnio(+ym.slice(0, 4)));
  return `
  <div class="head"><div><div class="eyebrow">Hogar</div><h1>Personas que aportan</h1></div>
    <div class="head-actions">${monthNav('mes')}<button class="btn primary" data-act="new-per">${ic('user-plus')}Agregar persona</button></div></div>
  ${S.personas.length && rep.totalPct !== 100 ? `<div class="banner warn">${ic('triangle-alert')}<div class="grow">Los porcentajes acordados suman <b>${fmtPct(rep.totalPct)}</b>. El reparto se calcula en proporción, pero lo ideal es que sumen 100 %.</div></div>` : ''}
  ${S.personas.length ? `<div class="grid g3">${rep.rows.map(r => { const a = repA.rows.find(x => x.p.id === r.p.id); return `
    <section class="card person-card">
      <div class="inline" style="flex-wrap:nowrap">${avatar(r.p)}<div style="flex:1;min-width:0"><h3>${esc(r.p.nombre)}</h3><span class="small muted">Aporta el ${fmtPct(r.p.porcentaje)} de los gastos</span></div>
        <button class="icon-btn" data-act="edit-per" data-id="${r.p.id}" aria-label="Editar">${ic('pencil')}</button><button class="icon-btn" data-act="del-per" data-id="${r.p.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>
      <div class="stack" style="gap:6px">
        <div class="eyebrow small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem">${ymLabel(ym)}</div>
        <div class="stat-line"><span class="muted">Ingresos aportados</span><b class="in">${money(r.aportado)}</b></div>
        <div class="stat-line"><span class="muted">Gastos que pagó</span><b>${money(r.pagado)}</b></div>
        <div class="stat-line"><span class="muted">Le corresponde pagar</span><b>${money(r.cuota)}</b></div>
        <div class="bar"><i style="width:${Math.min(100, pct(r.pagado, r.cuota || 1))}%;background:${r.p.color}"></i></div>
        <div class="stat-line"><span class="muted">Diferencia</span><span class="pill ${Math.abs(r.dif) < 1 ? 'neutral' : r.dif > 0 ? 'ok' : 'bad'}">${Math.abs(r.dif) < 1 ? 'A paz y salvo' : r.dif > 0 ? `Puso ${money(r.dif)} de más` : `Le faltan ${money(-r.dif)}`}</span></div>
      </div>
      <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px">
        <div class="stat-line small"><span class="muted">En el año: ingresos</span><b>${money(a.aportado)}</b></div>
        <div class="stat-line small"><span class="muted">En el año: gastos pagados</span><b>${money(a.pagado)} · ${fmtPct(pct(a.pagado, repA.total))}</b></div>
      </div>
      <button class="btn sm" data-act="ver-per" data-id="${r.p.id}">${ic('list')}Ver sus movimientos</button>
    </section>`; }).join('')}</div>
  <section class="card"><div class="card-h"><h2>${ic('arrow-right-left')}Ajuste de cuentas de ${ymLabel(ym).toLowerCase()}</h2></div>
    ${rep.pagos.length ? `<div class="list">${rep.pagos.map(x => `<div class="row">${avatar(x.de, true)}<div class="grow"><b>${esc(x.de.nombre)}</b> le paga a <b>${esc(x.a.nombre)}</b></div>${avatar(x.a, true)}<b class="num">${money(x.v)}</b></div>`).join('')}</div>` : empty('handshake', 'Nadie le debe a nadie este mes.')}
    <p class="small muted">Se compara lo que cada persona pagó en gastos con lo que le corresponde según su porcentaje. Los gastos sin persona asignada cuentan como fondo común y no entran en el reparto.</p>
  </section>
  <section class="card"><div class="card-h"><h2>${ic('chart-pie')}Participación en ingresos del año</h2><span class="muted small">Total ${money(ya.ing)}</span></div>
    <div class="stack">${repA.rows.map(r => `<div class="stack" style="gap:4px"><div class="stat-line small"><span class="inline">${avatar(r.p, true)}${esc(r.p.nombre)}</span><b>${money(r.aportado)} · ${fmtPct(pct(r.aportado, ya.ing))}</b></div><div class="bar"><i style="width:${pct(r.aportado, ya.ing)}%;background:${r.p.color}"></i></div></div>`).join('')}</div>
  </section>`
  : `<section class="card">${empty('users', 'Agrega a las personas que viven o aportan dinero en la casa. Así sabrás cuánto pone cada una y cómo repartir los gastos.', `<button class="btn primary" data-act="new-per">${ic('user-plus')}Agregar persona</button>`)}</section>`}`;

VIEWS.categorias = () => {
  const ym = UI.mes; const gastos = movsMes(ym).filter(m => m.tipo === 'gasto'); const by = byKey(gastos, m => m.categoriaId);
  const presTotal = sum(S.categorias.filter(c => c.tipo === 'gasto'), c => c.presupuesto);
  const block = (tipo, title, icon) => `
    <section class="card"><div class="card-h"><h2>${ic(icon)}${title}</h2><button class="btn sm" data-act="new-cat" data-tipo="${tipo}">${ic('plus')}Nueva</button></div>
    <div class="list">${S.categorias.filter(c => c.tipo === tipo).map(c => { const g = by[c.id] || 0; return `<div class="row">${catIcon(c)}<div class="grow"><div class="t">${esc(c.nombre)}</div>
      ${tipo === 'gasto' ? (c.presupuesto ? `<div class="stack" style="gap:3px;margin-top:4px"><div class="bar"><i style="width:${Math.min(100, pct(g, c.presupuesto))}%;background:${g > c.presupuesto ? 'var(--out)' : c.color}"></i></div><div class="s"><span class="num">${money(g)} de ${money(c.presupuesto)}</span>${g > c.presupuesto ? '<span class="out">Excedido</span>' : ''}</div></div>` : `<div class="s"><span>Sin presupuesto · gastado ${money(g)}</span></div>`) : ''}</div>
      <div class="acts" style="display:flex"><button class="icon-btn" data-act="edit-cat" data-id="${c.id}" aria-label="Editar">${ic('pencil')}</button><button class="icon-btn" data-act="del-cat" data-id="${c.id}" aria-label="Eliminar">${ic('trash-2')}</button></div></div>`; }).join('')}</div></section>`;
  return `
  <div class="head"><div><div class="eyebrow">Organización</div><h1>Categorías y presupuesto</h1></div><div class="head-actions">${monthNav('mes')}</div></div>
  <div class="grid g3">
    ${kpi('Presupuesto mensual', money(presTotal), 'target', 'in')}
    ${kpi('Gastado en ' + MESES[parseYM(ym)[1] - 1].toLowerCase(), money(sum(gastos, m => m.monto)), 'receipt', 'out')}
    ${kpi('Categorías excedidas', String(S.categorias.filter(c => c.presupuesto && (by[c.id] || 0) > c.presupuesto).length), 'triangle-alert', 'warn')}

  <div class="grid g2">${block('gasto', 'Categorías de gasto', 'arrow-up-right')}${block('ingreso', 'Categorías de ingreso', 'arrow-down-left')}</div>`;
};

VIEWS.fijos = () => {
  const ym = UI.mes; const ap = S.fijosAplicados[ym] || [];
  const tg = sum(S.fijos.filter(f => f.activo && f.tipo === 'gasto'), f => f.monto); const ti = sum(S.fijos.filter(f => f.activo && f.tipo === 'ingreso'), f => f.monto);

  return `
  <div class="head"><div><div class="eyebrow">Automatización</div><h1>Pagos e ingresos fijos</h1></div>

  <p class="muted" style="max-width:65ch">Guarda aquí lo que se repite cada mes (arriendo, servicios, colegio, salario). Con un clic quedan registrados en el mes que elijas, sin escribirlos de nuevo.</p>

    ${S.fijos.length ? `<div class="list">${[...S.fijos].sort((a, b) => a.dia - b.dia).map(f => { const c = cat(f.categoriaId); const done = ap.includes(f.id); return `<div class="row wrap" style="${f.activo ? '' : 'opacity:.55'}">${catIcon(c)}<div class="grow"><div class="t">${esc(f.descripcion)}</div><div class="s"><span>Día ${f.dia} de cada mes</span><span>${esc(c.nombre)}</span><span>${esc(perName(f.personaId))}</span></div></div>
      ${!f.activo ? '<span class="pill neutral">Pausado</span>' : done ? '<span class="pill ok">Registrado</span>' : `<button class="btn sm" data-act="apply-one" data-id="${f.id}" data-ym="${ym}">${ic('check')}Registrar</button>`}

      <div class="acts" style="display:flex"><button class="icon-btn" data-act="edit-fijo" data-id="${f.id}" aria-label="Editar">${ic('pencil')}</button><button class="icon-btn" data-act="del-fijo" data-id="${f.id}" aria-label="Eliminar">${ic('trash-2')}</button></div></div>`; }).join('')}</div>`

  </section>`;
};

VIEWS.metas = () => {
  const tot = sum(S.metas, g => g.ahorrado), obj = sum(S.metas, g => g.objetivo);
  return `
  <div class="head"><div><div class="eyebrow">Futuro</div><h1>Metas de ahorro</h1></div><div class="head-actions"><button class="btn primary" data-act="new-meta">${ic('plus')}Nueva meta</button></div></div>
  <div class="grid g3">${kpi('Total ahorrado', money(tot), 'piggy-bank', 'in')}${kpi('Objetivo total', money(obj), 'target', 'warn')}${kpi('Avance general', fmtPct(pct(tot, obj)), 'trending-up', 'in')}</div>
  ${S.metas.length ? `<div class="grid g3">${S.metas.map(g => { const p = Math.min(100, pct(g.ahorrado, g.objetivo)); const falta = Math.max(0, g.objetivo - g.ahorrado);
    let mensual = ''; if (g.fecha && falta > 0) { const [y, m] = g.fecha.split('-').map(Number); const [cy, cm] = parseYM(ymOf(todayStr())); const meses = Math.max(1, (y - cy) * 12 + (m - cm)); mensual = `Para llegar a tiempo ahorra <b>${money(falta / meses)}</b> al mes (${meses} mes${meses > 1 ? 'es' : ''}).`; }
    return `<section class="card"><div class="inline" style="flex-wrap:nowrap">${catIcon({ color: g.color, icono: g.icono })}<div style="flex:1;min-width:0"><h3>${esc(g.nombre)}</h3>${g.fecha ? `<span class="small muted">Para el ${dateLabel(g.fecha)}</span>` : ''}</div>
      <button class="icon-btn" data-act="edit-meta" data-id="${g.id}" aria-label="Editar">${ic('pencil')}</button><button class="icon-btn" data-act="del-meta" data-id="${g.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>
      <div class="inline" style="flex-wrap:nowrap"><div class="goal-ring" style="--p:${p}"><span>${Math.round(p)}%</span></div><div class="stack" style="gap:2px;min-width:0"><b class="num" style="font-size:1.2rem">${money(g.ahorrado)}</b><span class="small muted num">de ${money(g.objetivo)} · faltan ${money(falta)}</span></div></div>
      ${p >= 100 ? '<span class="pill ok">¡Meta cumplida!</span>' : mensual ? `<p class="small muted">${mensual}</p>` : ''}
      <div class="inline"><button class="btn sm" data-act="abono" data-id="${g.id}" data-s="1">${ic('plus')}Abonar</button><button class="btn sm ghost" data-act="abono" data-id="${g.id}" data-s="-1">${ic('minus')}Retirar</button></div></section>`; }).join('')}</div>`
    : `<section class="card">${empty('piggy-bank', 'Crea tu primera meta de ahorro.', `<button class="btn primary sm" data-act="new-meta">${ic('plus')}Nueva meta</button>`)}</section>`}`;
};

VIEWS.ajustes = () => `

function route() {

const fv = id => $('#' + id)?.value ?? '';
const parseMonto = s => { s = String(s).trim().replace(/\s/g, ''); if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(',', '.'); return Math.round((parseFloat(s) || 0) * 100) / 100; };
const catOptions = (tipo, sel) => S.categorias.filter(c => c.tipo === tipo).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');

function readMov() {

/* =========================================================
   Exportar / importar
   ========================================================= */
function download(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function csv(list, name) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Persona', 'Medio de pago', 'Valor', 'Notas'].map(q).join(';')];
  [...list].sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => rows.push([m.fecha, m.tipo === 'gasto' ? 'Gasto' : 'Ingreso', cat(m.categoriaId).nombre, m.descripcion, perName(m.personaId), m.metodo, String(m.tipo === 'gasto' ? -m.monto : m.monto).replace('.', ','), m.notas].map(q).join(';')));
  download(name, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast(`Se exportaron ${list.length} movimientos`);
}
$('#import-file').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return; const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.movimientos) || !Array.isArray(d.categorias)) throw new Error();
      confirmBox(`La copia tiene <b>${d.movimientos.length}</b> movimientos. Reemplazará todos los datos actuales.`, 'Restaurar copia', () => { S = Object.assign(emptyState(), d); save(); applyTheme(); render(); toast('Copia restaurada'); });
    } catch (err) { toast('Ese archivo no es una copia válida de Cuentas de la Casa'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

function applyFijo(f, ym) {
  const [y, m] = parseYM(ym); const d = Math.min(f.dia, dim(y, m));
  S.movimientos.push({ id: uid(), tipo: f.tipo, fecha: `${ym}-${pad(d)}`, monto: f.monto, categoriaId: f.categoriaId, personaId: f.personaId, metodo: f.metodo, descripcion: f.descripcion, notas: 'Registrado desde pagos fijos' });
  (S.fijosAplicados[ym] ||= []).push(f.id);
}
const ACT = {
  'close': () => closeModal(),
  'new-mov': () => movForm({}),
  'edit-mov': d => movForm(S.movimientos.find(m => m.id === d.id)),
  'del-mov': d => confirmBox('Este movimiento se eliminará de forma permanente.', 'Eliminar', () => { S.movimientos = S.movimientos.filter(m => m.id !== d.id); save(); render(); toast('Movimiento eliminado'); }),
  'save-mov': (d, el) => {
    const v = readMov(); if (!v) return; v.fecha = fv('mv-fecha') || todayStr(); v.notas = fv('mv-notas').trim();

    if (id) Object.assign(S.movimientos.find(m => m.id === id), v); else S.movimientos.push({ id: uid(), ...v });
    save(); render(); toast(id ? 'Cambios guardados' : (v.tipo === 'gasto' ? 'Gasto registrado' : 'Ingreso registrado'));
    if (d.more) { const keep = { tipo: v.tipo, fecha: v.fecha, personaId: v.personaId, metodo: v.metodo, categoriaId: v.categoriaId }; movForm(keep); } else closeModal();
  },
  'new-per': () => perForm(),
  'edit-per': d => perForm(per(d.id)),

    if (d.id) Object.assign(per(d.id), v); else S.personas.push({ id: uid(), ...v });

  'ver-per': d => { UI.f = { mes: UI.mes, tipo: '', cat: '', per: d.id, q: '', met: '' }; location.hash = '#movimientos'; },
  'new-cat': d => catForm({}, d.tipo),
  'edit-cat': d => catForm(S.categorias.find(c => c.id === d.id)),

    if (d.id) Object.assign(S.categorias.find(c => c.id === d.id), v); else S.categorias.push({ id: uid(), ...v });
    save(); closeModal(); render(); toast('Categoría guardada');
  },
  'del-cat': d => { const n = S.movimientos.filter(m => m.categoriaId === d.id).length;

    () => { $('#jn-ok').onclick = () => { const t = fv('jn-link').trim(); closeModal(); invitacion(t); }; }),
  'copy-invite': () => { const link = inviteLink(); const inp = $('#invite-text');
    navigator.clipboard.writeText(link).then(() => toast('Enlace copiado. Envíalo a tu familia'))
      .catch(() => { inp.value = link; inp.hidden = false; inp.select(); toast('Copia el enlace que aparece seleccionado'); }); },
  'share-invite': () => navigator.share({ title: 'Cuentas de la Casa', text: `Únete a las cuentas de ${S.hogar}:`, url: inviteLink() }).catch(() => {}),
  'leave-sync': () => confirmBox('Este teléfono dejará de recibir y enviar cambios. Conserva una copia local de los datos y el hogar sigue igual para los demás.', 'Dejar de sincronizar', salirHogar),
  'set-yo': d => { LOCAL.yo = d.id; lsSet(LOCAL_KEY, LOCAL); closeModal(); toast(`Hola, ${perName(d.id)}`); },
});

if ('serviceWorker' in navigator && isOnline()) navigator.serviceWorker.register('sw.js').catch(() => {});
setEstado('local');
startSync();

applyTheme();
route();
</script>
</body>
</html>
