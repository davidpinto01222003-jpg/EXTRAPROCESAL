# ---------------------------------------------------------------------
#  Configuracion de la campana del webinar
#  "Recuperacion de cartera con EPS intervenidas"
#
#  Cambia aqui lo que necesites. NO se guarda ninguna contrasena en
#  este archivo: la contrasena de aplicacion de Google se pide cada vez
#  que se ejecuta el envio.
# ---------------------------------------------------------------------

[remitente]
# Cuenta de Google Workspace desde la que sale el correo.
correo = contactoclientes@oscal.net
# Nombre que ve el destinatario en la bandeja de entrada.
nombre = Oscar Alfredo López Torres
# A donde llegan las respuestas (si se deja vacio, al mismo correo).
responder_a =

[servidor]
host = smtp.gmail.com
puerto = 587
# Variable de entorno de donde se puede leer la contrasena de
# aplicacion para no tener que escribirla. Si no existe, se pregunta.
variable_contrasena = OSCAL_SMTP_PASSWORD

[mensaje]
asunto = Invitación: cobro de cartera a EPS intervenidas — 23 de septiembre
enlace_inscripcion = https://forms.gle/cWP4JHBBTsQQ5sNa9
# Imagen que se muestra DENTRO del correo. Si el archivo no existe, el
# correo se envia igual, sin imagen y sin espacios en blanco raros.
imagen = recursos/imagen_webinar.jpg
# Brochure que se adjunta. Deja el valor vacio para no adjuntar nada y
# enviar solo el enlace (pesa menos y baja el riesgo de SPAM).
adjunto = recursos/Brochure_OSCAL_Consultores_Juridicos.pdf

[base]
# Archivo con los contactos. Acepta .xlsx y .csv.
archivo = contactos.xlsx

[envio]
# Tope de correos por dia. Google Workspace permite 2000 en total,
# contando los correos normales de la oficina.
maximo_por_dia = 300
# Pausa aleatoria entre un correo y el siguiente, en segundos.
pausa_minima = 10
pausa_maxima = 20
# Cuantas veces reintentar un correo que falla por un error pasajero.
reintentos = 2

[buzon]
# Servidor IMAP para buscar rebotes y solicitudes de retiro.
host = imap.gmail.com
puerto = 993
# Cuantos dias hacia atras revisar.
dias = 15
